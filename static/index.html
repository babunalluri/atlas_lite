<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas Lite — Entry Sheet</title>
  <style>
    :root,
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1419;
      --panel: #1a2332;
      --line: #2d3a4d;
      --ink: #e8edf4;
      --muted: #8b9cb3;
      --pass: #34d399;
      --fail: #f87171;
      --accent: #2dd4bf;
      --warn: #fbbf24;
      --card-bg-top: #1a2a3d;
      --card-bg-bottom: #152030;
      --card-pass-top: rgba(52, 211, 153, 0.07);
      --card-fail-top: rgba(248, 113, 113, 0.07);
      --card-divider: rgba(255, 255, 255, 0.06);
      --card-shadow: rgba(0, 0, 0, 0.22);
      --parity-bg: #152030;
      --warn-bg: rgba(251, 191, 36, 0.1);
      --warn-border: rgba(251, 191, 36, 0.3);
      --pass-bg: rgba(52, 211, 153, 0.15);
      --fail-bg: rgba(248, 113, 113, 0.15);
      --control-border: #4a627e;
      --control-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
      --header-control-h: 28px;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --line: #d5dde8;
      --ink: #0f172a;
      --muted: #64748b;
      --pass: #059669;
      --fail: #dc2626;
      --accent: #0d9488;
      --warn: #d97706;
      --card-bg-top: #ffffff;
      --card-bg-bottom: #f8fafc;
      --card-pass-top: rgba(5, 150, 105, 0.08);
      --card-fail-top: rgba(220, 38, 38, 0.08);
      --card-divider: rgba(15, 23, 42, 0.08);
      --card-shadow: rgba(15, 23, 42, 0.08);
      --parity-bg: #f1f5f9;
      --warn-bg: rgba(217, 119, 6, 0.1);
      --warn-border: rgba(217, 119, 6, 0.28);
      --pass-bg: rgba(5, 150, 105, 0.12);
      --fail-bg: rgba(220, 38, 38, 0.12);
      --control-border: #b8c5d6;
      --control-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      --header-control-h: 28px;
    }
    * { box-sizing: border-box; }
    .no-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    html {
      font-size: 13px;
    }
    html,
    body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 1rem;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    main,
    .page-layout,
    .chain-panel,
    .main-stage,
    .chart-panel {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    main::-webkit-scrollbar,
    .page-layout::-webkit-scrollbar,
    .chain-panel::-webkit-scrollbar,
    .main-stage::-webkit-scrollbar,
    .chart-panel::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    header {
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .header-top {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .header-left { justify-self: start; min-width: 0; }
    .header-center { justify-self: center; }
    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-meta-end {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .header-meta {
      justify-self: end;
      width: 100%;
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      font-size: 0.8125rem;
      font-family: ui-monospace, monospace;
      min-width: 0;
      max-width: 100%;
      white-space: nowrap;
      overflow: visible;
    }
    h1 { margin: 0; font-size: 0.9375rem; font-weight: 600; }
    .nb-switch {
      display: inline-flex;
      gap: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .nb-switch a {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
    }
    .nb-switch a:hover { color: var(--text); border-color: var(--muted); }
    .nb-switch a.active {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .header-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      min-width: 0;
    }
    .header-title-row h1 { font-size: 0.9375rem; flex-shrink: 0; }
    .header-atm,
    .header-legs {
      font-size: 0.8125rem;
      font-family: ui-monospace, monospace;
      white-space: nowrap;
    }
    .header-atm { flex-shrink: 0; }
    .header-legs {
      color: var(--muted);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .theme-toggle,
    .header-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: border-box;
      height: var(--header-control-h);
      min-height: var(--header-control-h);
      border: 1px solid var(--control-border);
      border-radius: 6px;
      background: var(--parity-bg);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      padding: 0 8px;
      gap: 5px;
      white-space: nowrap;
      box-shadow: var(--control-shadow);
      transition: color 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .header-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .theme-toggle {
      width: var(--header-control-h);
      min-width: var(--header-control-h);
      padding: 0;
      font-size: 0.875rem;
    }
    .theme-toggle:hover,
    .header-btn:hover,
    .header-btn.active {
      color: var(--ink);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),
        var(--control-shadow);
    }
    .parity-bell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--parity-bg);
      color: var(--muted);
      opacity: 0.55;
      cursor: default;
      transition: color 0.2s, border-color 0.2s, opacity 0.2s, box-shadow 0.2s;
    }
    .ai-bell-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
      line-height: 1;
    }
    .ai-bell-wrap .parity-bell {
      width: 32px;
      height: 32px;
    }
    .ai-bell-wrap .parity-bell svg {
      width: 16px;
      height: 16px;
    }
    .ai-bell-label {
      font-size: 0.5625rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      line-height: 1;
    }
    .ai-bell.enter {
      opacity: 1;
      color: var(--pass);
      border-color: color-mix(in srgb, var(--pass) 55%, transparent);
      background: var(--pass-bg);
      animation: parity-blink 0.85s ease-in-out infinite;
    }
    .ai-bell.watch {
      opacity: 1;
      color: var(--warn);
      border-color: color-mix(in srgb, var(--warn) 55%, transparent);
      background: var(--warn-bg);
    }
    .ai-bell.idle {
      opacity: 0.45;
      color: var(--muted);
    }
    .parity-bell svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .parity-bell.green {
      opacity: 1;
      color: var(--pass);
      border-color: color-mix(in srgb, var(--pass) 55%, transparent);
      background: var(--pass-bg);
      animation: parity-blink 0.85s ease-in-out infinite;
    }
    .parity-bell.orange {
      opacity: 1;
      color: var(--warn);
      border-color: color-mix(in srgb, var(--warn) 55%, transparent);
      background: var(--warn-bg);
    }
    .parity-bell.red {
      opacity: 1;
      color: var(--fail);
      border-color: color-mix(in srgb, var(--fail) 55%, transparent);
      background: var(--fail-bg);
    }
    .bell-tip-wrap {
      position: relative;
      display: inline-flex;
      z-index: 40;
    }
    .bell-gate-tip {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      max-width: 280px;
      padding: 8px 10px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      text-align: left;
      white-space: normal;
      z-index: 50;
    }
    .bell-tip-wrap:hover .bell-gate-tip,
    .bell-tip-wrap:focus-within .bell-gate-tip {
      display: block;
    }
    .bell-gate-tip-head {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .bell-gate-tip ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .bell-gate-tip li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.75rem;
      line-height: 1.45;
    }
    .bell-gate-tip li + li {
      border-top: 1px solid var(--card-divider);
      padding-top: 3px;
      margin-top: 3px;
    }
    .bell-gate-tip .gate-state {
      font-family: ui-monospace, monospace;
      font-size: 0.6875rem;
      flex-shrink: 0;
    }
    .bell-gate-tip li.pass { color: var(--pass); }
    .bell-gate-tip li.fail { color: var(--fail); }
    .bell-gate-tip li.miss { color: var(--warn); }
    @keyframes parity-blink {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(251, 191, 36, 0);
      }
      50% {
        opacity: 0.45;
        transform: scale(1.06);
        box-shadow: 0 0 14px 2px rgba(251, 191, 36, 0.45);
      }
    }
    .sub { font-size: 0.75rem; color: var(--muted); margin-top: 0; }
    .watch-strips {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .watch-strips:empty { display: none; margin: 0; }
    .watch-top {
      display: grid;
      grid-template-columns: 5fr 4fr;
      gap: 6px;
    }
    .watch-group-label {
      font-size: 0.625rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 3px 1px;
    }
    .watch-group-cards {
      display: grid;
      gap: 3px;
    }
    .watch-group-cards.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .watch-group-cards.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .watch-group-cards.cols-11 { grid-template-columns: repeat(11, minmax(0, 1fr)); }
    .watch-card {
      background: var(--card-bg-bottom);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 5px 5px;
      text-align: center;
      position: relative;
      min-width: 0;
    }
    .watch-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      border-radius: 6px 6px 0 0;
      background: var(--muted);
    }
    .watch-card.up::before { background: var(--pass); }
    .watch-card.down::before { background: var(--fail); }
    .watch-card .name {
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: var(--ink);
    }
    .watch-card .ltp {
      font-family: ui-monospace, monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      margin: 2px 0 1px;
    }
    .watch-card .chg-row {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
    }
    .watch-card .chg {
      font-family: ui-monospace, monospace;
      font-size: 0.6875rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .watch-card .chg.up { color: var(--pass); }
    .watch-card .chg.down { color: var(--fail); }
    .watch-card .chg.na { color: var(--muted); font-weight: 400; }
    .watch-group-cards.cols-11 .watch-card {
      padding: 4px 3px 5px;
    }
    .watch-group-cards.cols-11 .watch-card .name {
      font-size: 0.625rem;
    }
    .watch-group-cards.cols-11 .watch-card .ltp {
      font-size: 0.75rem;
    }
    .watch-group-cards.cols-11 .watch-card .chg-row {
      flex-wrap: wrap;
      gap: 1px 4px;
    }
    .watch-group-cards.cols-11 .watch-card .chg {
      font-size: 0.625rem;
    }
    @media (max-width: 900px) {
      .watch-top { grid-template-columns: 1fr; }
      .watch-group-cards.cols-4,
      .watch-group-cards.cols-5,
      .watch-group-cards.cols-11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .header-top {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }
      .header-left,
      .header-center,
      .header-meta { justify-self: center; }
      .header-meta { justify-content: center; }
      .header-actions { justify-content: center; }
    }
    .header-meta-end .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: border-box;
      height: var(--header-control-h);
      min-height: var(--header-control-h);
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--control-border);
      font-weight: 600;
      font-size: 0.75rem;
      line-height: 1;
      white-space: nowrap;
      box-shadow: var(--control-shadow);
    }
    .header-meta-end .badge.ready {
      background: var(--pass-bg);
      color: var(--pass);
      border-color: color-mix(in srgb, var(--pass) 45%, var(--control-border));
    }
    .header-meta-end .badge.wait {
      background: var(--warn-bg);
      color: var(--warn);
      border-color: var(--warn-border);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      line-height: 1.2;
      white-space: nowrap;
    }
    .badge.ready { background: var(--pass-bg); color: var(--pass); }
    .badge.wait { background: var(--warn-bg); color: var(--warn); }
    main { padding: 0; flex: 1; min-height: 0; overflow: hidden; }
    .page-layout {
      display: grid;
      grid-template-columns: min-content minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
      padding: 10px 12px;
      height: 100%;
      min-height: 0;
    }
    .chain-panel {
      min-width: 0;
      width: min-content;
      max-width: 100%;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 8px 6px;
    }
    .chain-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 0.75rem;
      min-height: var(--header-control-h);
      width: 100%;
      max-width: 100%;
    }
    .chain-bar label {
      color: var(--muted);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .chain-meta {
      color: var(--muted);
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
      flex: 0 0 auto;
      white-space: nowrap;
      background: var(--panel);
    }
    .chain-meta:empty { display: none; }
    .main-stage {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chart-panel {
      min-width: 0;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      padding: 0;
    }
    .chart-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
      padding: 5px 8px;
      border-bottom: 1px solid var(--line);
    }
    .chart-toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }
    .chart-tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 24px;
      min-width: 32px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.6875rem;
      font-weight: 600;
    }
    .chart-tool-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      color: inherit;
      flex-shrink: 0;
    }
    .chart-tool-btn.active,
    .chart-tool-btn:hover {
      color: var(--ink);
      border-color: var(--accent);
    }
    .chart-tool-btn:disabled {
      opacity: 1;
      color: color-mix(in srgb, var(--ink) 45%, var(--muted));
      cursor: default;
    }
    .chart-link { cursor: pointer; }
    .header-atm { cursor: pointer; }
    .chain-table td.strike-col { cursor: pointer; }
    .chain-summary-item.chart-link { cursor: pointer; }
    .chart-toolbar-end {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .chart-shot-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      min-width: 26px;
      padding: 0;
      color: var(--ink);
    }
    .chart-shot-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      color: var(--ink);
    }
    .chart-shot-btn:disabled {
      color: color-mix(in srgb, var(--ink) 50%, var(--muted));
    }
    .chart-shot-btn:disabled svg {
      color: inherit;
      fill: currentColor;
    }
    .chart-draw-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .chart-line-style {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .chart-line-style[hidden] { display: none; }
    .chart-line-size-panel {
      min-width: 0;
      width: max-content;
      padding: 3px;
    }
    .chart-line-size-panel .chart-menu-item {
      width: auto;
      gap: 6px;
      padding: 4px 8px;
      white-space: nowrap;
    }
    .chart-line-size-panel .line-weight {
      width: 1.25rem;
    }
    .chart-line-color-panel {
      min-width: 0;
      width: max-content;
      padding: 8px;
      overflow: visible;
    }
    .chart-honeycomb {
      position: relative;
      width: var(--honey-w, 196px);
      height: var(--honey-h, 180px);
      margin: 0 auto;
    }
    .chart-honey-cell {
      position: absolute;
      box-sizing: border-box;
      width: var(--honey-size, 18px);
      height: calc(var(--honey-size, 18px) * 1.1547);
      margin: 0;
      padding: 0;
      border: 0;
      background: var(--swatch, #fff);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
    .chart-honey-cell:hover,
    .chart-honey-cell.active {
      outline: 2px solid #fff;
      outline-offset: -2px;
      z-index: 2;
      filter: brightness(1.08);
    }
    .chart-line-color-toggle .color-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--swatch, #60a5fa);
      border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent);
      flex-shrink: 0;
    }
    .chart-menu-item .line-weight {
      display: block;
      width: 2rem;
      height: var(--swatch-h, 2px);
      background: var(--swatch, currentColor);
      border-radius: 1px;
      flex-shrink: 0;

    function barVolume(bar) {
      return Number(bar.volume) || 0;
    }

    function barOi(bar) {
      return Number(bar.oi) || 0;
    }

    function seedOhlc(bar) {
      return {
        open: bar.open,
        high: bar.high,
        low: bar.low,
        close: bar.close,
        volume: barVolume(bar),
        oi: barOi(bar),
        adx: bar.adx,
        pdi: bar.pdi,
        mdi: bar.mdi,
      };
    }

    function rollOhlc(cur, bar) {
      cur.high = Math.max(cur.high, bar.high);
      cur.low = Math.min(cur.low, bar.low);
      cur.close = bar.close;
      cur.volume += barVolume(bar);
      cur.oi = barOi(bar);
      if (bar.adx != null) cur.adx = bar.adx;
      if (bar.pdi != null) cur.pdi = bar.pdi;
      if (bar.mdi != null) cur.mdi = bar.mdi;
    }

    function syncServerDmiMap(bars) {
      serverDmiByTime = new Map();
      for (const bar of bars || []) {
        if (bar == null || bar.time == null) continue;
        if (bar.adx == null && bar.pdi == null && bar.mdi == null) continue;
        serverDmiByTime.set(Number(bar.time), {
          pdi: bar.pdi ?? null,
          mdi: bar.mdi ?? null,
          adx: bar.adx ?? null,
        });
      }
    }

    function dmiLookupKey(tsMs) {
      const t = Math.floor(Number(tsMs) / 1000);
      if (!niftyInterval || niftyInterval <= 1) return t;
      const bucket = niftyInterval * 60;
      const bucketStart = Math.floor(t / bucket) * bucket;
      return bucketStart + (niftyInterval - 1) * 60;
    }

    function aggregateBars(bars, minutes) {
      if (!minutes || minutes <= 1) return bars.map((b) => ({ ...b }));
      const bucket = minutes * 60;
      const out = [];
      let cur = null;
      for (const b of bars) {
        const t = Math.floor(b.time / bucket) * bucket;
        if (!cur || cur.time !== t) {
          cur = { time: t, ...seedOhlc(b) };
          out.push(cur);
        } else {
          rollOhlc(cur, b);
        }
      }
      return out;
    }

    function dailyBars(bars) {
      const grouped = new Map();
      for (const b of bars) {
        const key = new Date(b.time * 1000).toLocaleDateString("en-CA", {
          timeZone: "Asia/Kolkata",
        });
        const prev = grouped.get(key);
        if (!prev) {
          grouped.set(key, { time: key, ...seedOhlc(b) });
        } else {
          rollOhlc(prev, b);
        }
      }
      return [...grouped.values()];
    }

    function viewBars() {
      if (niftyInterval === 0) return dailyBars(niftyRawBars);
      return aggregateBars(niftyRawBars, niftyInterval);
    }

    function toKline(bars) {
      return bars.map((b) => ({
        timestamp: typeof b.time === "string"
          ? new Date(`${b.time}T00:00:00+05:30`).getTime()
          : Number(b.time) * 1000,
        open: b.open,
        high: b.high,
        low: b.low,
        close: b.close,
        volume: barVolume(b),
        oi: barOi(b),
        pdi: b.pdi,
        mdi: b.mdi,
        adx: b.adx,
      }));
    }

    function formatHudTime(ts) {

    function formatHudNum(value, digits) {
      if (value == null || !Number.isFinite(Number(value))) return "—";
      return Number(value).toLocaleString("en-IN", {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits > 0 ? Math.min(digits, 2) : 0,
      });
    }

    function renderOhlcHud(k, crosshairData) {
      const el = document.getElementById("chartOhlcHud");
      if (!el) return;
      if (!k || k.close == null) {
        el.textContent = "";
        return;
      }
      let html =
        `${formatHudTime(k.timestamp)}<br>` +
        `O ${formatHudNum(k.open, 2)}  H ${formatHudNum(k.high, 2)}  ` +
        `L ${formatHudNum(k.low, 2)}  C ${formatHudNum(k.close, 2)}<br>` +
        `FUT Vol ${formatHudNum(k.volume, 0)}  OI ${formatHudNum(k.oi, 0)}`;

      if (crosshairData && crosshairData.indicatorData) {
        const parts = [];
        Object.entries(crosshairData.indicatorData).forEach(([paneId, indMap]) => {
          if (!indMap) return;
          Object.entries(indMap).forEach(([name, vals]) => {
            if (!vals || typeof vals !== "object") return;
            const sub = [];
            Object.entries(vals).forEach(([kKey, v]) => {
              if (v != null && Number.isFinite(Number(v))) {
                sub.push(`${kKey.toUpperCase()} ${Number(v).toFixed(2)}`);
              }
            });
            if (sub.length) {
              parts.push(`<b>${name}</b> ${sub.join(" ")}`);
            }
          });
        });
        if (parts.length) {
          html += `<br>${parts.join("  ·  ")}`;
        }
      } else if (latestFeedAdx != null && Number.isFinite(Number(latestFeedAdx))) {
        html += `<br><b>ADX</b> ${Number(latestFeedAdx).toFixed(2)}`;
        if (latestFeedAtr != null && Number.isFinite(Number(latestFeedAtr))) {
          html += `  ·  <b>ATR</b> ${Number(latestFeedAtr).toFixed(2)}`;
        }

    function showChartToast(text) {

    function calcAtrSeries(dataList, period) {
      const out = new Array(dataList.length).fill(null);
      let prevClose = null;
      for (let i = 0; i < dataList.length; i += 1) {
        const h = Number(dataList[i].high);
        const l = Number(dataList[i].low);
        const c = Number(dataList[i].close);
        const tr = prevClose == null
          ? h - l
          : Math.max(h - l, Math.abs(h - prevClose), Math.abs(l - prevClose));
        if (i === 0) {
          out[i] = null;
        } else if (i < period) {
          let sum = 0;
          let n = 0;
          for (let j = 1; j <= i; j += 1) {
            const hh = Number(dataList[j].high);
            const ll = Number(dataList[j].low);
            const pc = Number(dataList[j - 1].close);
            sum += Math.max(hh - ll, Math.abs(hh - pc), Math.abs(ll - pc));
            n += 1;
          }
          out[i] = n ? sum / n : null;
        } else if (i === period) {
          let sum = 0;
          for (let j = 1; j <= period; j += 1) {
            const hh = Number(dataList[j].high);
            const ll = Number(dataList[j].low);
            const pc = Number(dataList[j - 1].close);
            sum += Math.max(hh - ll, Math.abs(hh - pc), Math.abs(ll - pc));
          }
          out[i] = sum / period;
        } else {
          out[i] = (out[i - 1] * (period - 1) + tr) / period;
        }
        prevClose = c;
      }
      return out;
    }

      try {

          figures: [

            let day = "";

              const v = Number(k.volume) || 0;
              pv += typical * v;
              sumSq += typical * typical * v;
              vol += v;
              const vwap = vol > 0 ? pv / vol : typical;
              const variance = vol > 0 ? Math.max(0, sumSq / vol - vwap * vwap) : 0;
              const sigma = Math.sqrt(variance);
              return {
                vwap,
                up1: vwap + sigma,
                dn1: vwap - sigma,
                up2: vwap + 2 * sigma,
                dn2: vwap - 2 * sigma,
              };

              const close = Number(k.close);
              const prevClose = i > 0 ? Number(dataList[i - 1].close) : close;
              if (finalUpper == null) {

          calc: (dataList, indicator) => {
            const period = Number(indicator.calcParams[0]) || 14;
            let avgGain = 0;
            let avgLoss = 0;
            return dataList.map((k, i) => {
              if (i === 0) return {};

              const gain = change > 0 ? change : 0;
              const loss = change < 0 ? -change : 0;
              if (i < period) {
                avgGain += gain;
                avgLoss += loss;
                return {};
              }
              if (i === period) {
                avgGain = (avgGain + gain) / period;
                avgLoss = (avgLoss + loss) / period;
              } else {
                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;

              if (avgLoss === 0) return { rsi: 100 };

            const dxList = [];

            return dataList.map((k, i) => {
              if (i === 0) return {};
              const prev = dataList[i - 1];
              const h = Number(k.high);
              const l = Number(k.low);
              const cPrev = Number(prev.close);
              const tr = Math.max(h - l, Math.abs(h - cPrev), Math.abs(l - cPrev));
              const upMove = h - Number(prev.high);
              const downMove = Number(prev.low) - l;
              const dmPlus = (upMove > downMove && upMove > 0) ? upMove : 0;
              const dmMinus = (downMove > upMove && downMove > 0) ? downMove : 0;

              if (i < period) {
                sumTr += tr;
                sumDmPlus += dmPlus;

              } else {

                dmPlusSm = dmPlusSm - (dmPlusSm / period) + dmPlus;
                dmMinusSm = dmMinusSm - (dmMinusSm / period) + dmMinus;
              }
              const pdi = trSm > 0 ? (dmPlusSm / trSm) * 100 : 0;
              const mdi = trSm > 0 ? (dmMinusSm / trSm) * 100 : 0;
              const diSum = pdi + mdi;
              const dx = diSum > 0 ? (Math.abs(pdi - mdi) / diSum) * 100 : 0;
              dxList.push(dx);

              let adx = null;

            const session = [];

            const volBins = new Array(bins).fill(0);
            session.forEach((k) => {
              const mid = (Number(k.high) + Number(k.low)) / 2;
              let idx = Math.floor((mid - lo) / step);
              if (idx < 0) idx = 0;
              if (idx >= bins) idx = bins - 1;
              volBins[idx] += Number(k.volume) || 0;
            });
            const maxVol = Math.max(...volBins, 1);
            const maxW = Math.min(120, bounding.width * 0.28);
            let poc = 0;

              const priceBot = priceTop - step;
              const y1 = yAxis.convertToPixel(priceTop);
              const y2 = yAxis.convertToPixel(priceBot);
              const h = Math.max(1, Math.abs(y2 - y1) - 1);
              const w = (volBins[i] / maxVol) * maxW;
              const y = Math.min(y1, y2);
              ctx.fillStyle = i === poc ? "rgba(251,191,36,0.45)" : "rgba(45,212,191,0.22)";
              ctx.fillRect(0, y, w, h);
            }
            const pocPrice = lo + (poc + 0.5) * step;
            const pocY = yAxis.convertToPixel(pocPrice);
            ctx.strokeStyle = "rgba(251,191,36,0.95)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, pocY);
            ctx.lineTo(bounding.width, pocY);
            ctx.stroke();
            ctx.fillStyle = "rgba(251,191,36,0.95)";
            ctx.font = "10px ui-monospace, monospace";
            ctx.fillText(`POC ${pocPrice.toFixed(1)}`, 4, pocY - 3);
            ctx.restore();
            return true;

            return [{ type: "polygon", attrs: { coordinates: coordinates.slice(0, 3) }, styles: strokeFill }];
          },
        });
      } catch (_) {}
      try {
        klinecharts.registerOverlay({
          name: "atlasArrow",
          totalStep: 3,
          needDefaultPointFigure: true,
          needDefaultXAxisFigure: true,
          needDefaultYAxisFigure: true,
          createPointFigures: ({ coordinates }) => {
            if (coordinates.length < 2) return [];
            const start = coordinates[0];
            const end = coordinates[1];
            const angle = Math.atan2(end.y - start.y, end.x - start.x);
            const size = 10;
            const left = {
              x: end.x - size * Math.cos(angle - Math.PI / 6),
              y: end.y - size * Math.sin(angle - Math.PI / 6),
            };
            const right = {
              x: end.x - size * Math.cos(angle + Math.PI / 6),

          },
        });
      } catch (_) {}
      try {
        klinecharts.registerOverlay({
          name: "atlasFibSegment",
          totalStep: 3,
          needDefaultPointFigure: true,
          needDefaultXAxisFigure: true,
          needDefaultYAxisFigure: true,
          createPointFigures: ({ coordinates, overlay }) => {
            if (coordinates.length < 2) return [];
            const percents = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
            const y0 = coordinates[0].y;
            const y1 = coordinates[1].y;
            const v0 = Number(overlay.points[0].value);
            const v1 = Number(overlay.points[1].value);
            const left = Math.min(coordinates[0].x, coordinates[1].x);
            const right = Math.max(coordinates[0].x, coordinates[1].x);
            const lines = [];
            const texts = [];
            percents.forEach((pct) => {
              const y = y0 + (y1 - y0) * pct;

              lines.push({ coordinates: [{ x: left, y }, { x: right, y }] });

            return [

        });

    function listOverlays() {
      if (!niftyChart) return [];
      try {
        const store = niftyChart._chartStore.getOverlayStore();
        const out = [];
        store._instances.forEach((arr) => {
          arr.forEach((ov) => out.push(ov));
        });
        return out;
      } catch (_) {
        return [];
      }
    }

    function drawLineStyles(size, color) {
      const s = Math.max(1, Number(size) || 1);
      const c = color || chartDrawLineColor;
      return {
        line: { size: s, color: c },
        rect: { borderSize: s, borderColor: c },
        polygon: { borderSize: s, borderColor: c, color: c },
        circle: { borderSize: s, borderColor: c },
        arc: { size: s, color: c },
      };
    }

    function resolveOverlayLineSize(ov) {
      if (!ov) return chartDrawLineSize;
      if (ov.lineSize != null) return Number(ov.lineSize) || 1;
      const styles = ov.styles || {};
      return Number(
        styles.line?.size
        || styles.rect?.borderSize
        || styles.polygon?.borderSize
        || styles.circle?.borderSize
        || styles.arc?.size
        || 1
      ) || 1;
    }

    function resolveOverlayLineColor(ov) {
      if (!ov) return chartDrawLineColor;
      if (ov.lineColor) return ov.lineColor;
      const styles = ov.styles || {};
      return styles.line?.color
        || styles.rect?.borderColor
        || styles.polygon?.borderColor
        || styles.circle?.borderColor
        || styles.arc?.color
        || chartDrawLineColor;
    }

    function overlaySnapshot(ov) {
      return {
        name: ov.name,
        id: ov.id,
        points: (ov.points || []).map((p) => ({
          timestamp: p.timestamp,
          value: p.value,
          dataIndex: p.dataIndex,
        })),
        extendData: ov.extendData,
        lineSize: resolveOverlayLineSize(ov),
        lineColor: resolveOverlayLineColor(ov),
      };
    }

    function overlaysState() {
      return listOverlays().map(overlaySnapshot);
    }

    function overlayDrawOptions(name, extra) {
      const opts = Object.assign({}, extra || {});
      const size = opts.lineSize != null ? opts.lineSize : chartDrawLineSize;
      const color = opts.lineColor != null ? opts.lineColor : chartDrawLineColor;
      delete opts.lineSize;
      delete opts.lineColor;
      opts.styles = Object.assign({}, drawLineStyles(size, color), opts.styles || {});
      return Object.assign({
        name,
        mode: "strong_magnet",
        onDrawEnd: () => {
          if (!overlayIgnore) {
            chartDrawTool = null;
            renderDrawBar();
            setTimeout(pushOverlayHistory, 0);
          }
          return false;
        },
        onPressedMoveEnd: () => {
          if (!overlayIgnore) setTimeout(pushOverlayHistory, 0);
          return false;
        },
        onRemoved: () => {
          if (!overlayIgnore) setTimeout(pushOverlayHistory, 0);
          return false;
        },
      }, opts);
    }

    function pushOverlayHistory() {
      const next = overlaysState();
      const prev = overlayHistory[overlayHistory.length - 1];
      if (JSON.stringify(prev) === JSON.stringify(next)) return;
      overlayHistory.push(next);
      overlayRedo = [];
      if (overlayHistory.length > 80) overlayHistory.shift();
      const undoBtn = document.getElementById("chartDrawUndo");
      const redoBtn = document.getElementById("chartDrawRedo");
      if (undoBtn) undoBtn.disabled = overlayHistory.length < 2;
      if (redoBtn) redoBtn.disabled = !overlayRedo.length;
    }

    function applyOverlayState(snaps) {
      if (!niftyChart) return;
      overlayIgnore = true;
      try {
        niftyChart.removeOverlay();
        snaps.forEach((snap) => {
          try {
            niftyChart.createOverlay(overlayDrawOptions(snap.name, {
              id: snap.id,
              points: snap.points,
              extendData: snap.extendData,
              lineSize: snap.lineSize || 1,
              lineColor: snap.lineColor || chartDrawLineColor,
            }));
          } catch (_) {}
        });
      } catch (_) {}
      overlayIgnore = false;
    }

    function undoDrawing() {
      if (!niftyChart || overlayHistory.length < 2) return;
      overlayRedo.push(overlayHistory.pop());
      applyOverlayState(overlayHistory[overlayHistory.length - 1]);
      chartDrawTool = null;
      renderDrawBar();
    }

    function redoDrawing() {
      if (!niftyChart || !overlayRedo.length) return;
      const next = overlayRedo.pop();
      overlayHistory.push(next);
      applyOverlayState(next);
      chartDrawTool = null;
      renderDrawBar();
    }

    function bindChartHud() {
      if (!niftyChart || chartHudBound) return;
      chartHudBound = true;
      niftyChart.subscribeAction("onCrosshairChange", (data) => {
        const k = data && data.kLineData;
        if (k) renderOhlcHud(k, data);
      });
    }

    function checkPriceAlerts(bars) {
      if (!bars.length) return;
      const close = Number(bars[bars.length - 1].close);
      const prev = checkPriceAlerts._prev;
      checkPriceAlerts._prev = close;
      if (prev == null || prev === close || !Number.isFinite(close)) return;
      listOverlays().forEach((ov) => {
        if (!PRICE_ALERT_OVERLAYS.has(ov.name)) return;
        const px = Number((ov.points && ov.points[0] && ov.points[0].value));
        if (!Number.isFinite(px)) return;
        const crossed = (prev < px && close >= px) || (prev > px && close <= px);
        const id = ov.id || `${ov.name}:${px}`;
        if (crossed && !priceAlertArmed.get(id)) {
          priceAlertArmed.set(id, true);
          showChartToast(`Price alert ${px.toFixed(2)} · now ${close.toFixed(2)}`);
          playTempleBellTwice();
        } else if (!crossed && Math.abs(close - px) > Math.max(2, px * 0.0002)) {
          priceAlertArmed.set(id, false);
        }
      });
    }

    function disposeChart() {
      const host = document.getElementById("klineHost");
      if (niftyChart && typeof klinecharts !== "undefined") {
        try {
          klinecharts.dispose(host || niftyChart);
        } catch (_) {}
      }
      niftyChart = null;
      chartHasFullData = false;
      chartHasVol = false;
      chartHudBound = false;
      chartDrawTool = null;
      overlayHistory = [[]];
      overlayRedo = [];
      Object.keys(chartIndicatorPanes).forEach((key) => { delete chartIndicatorPanes[key]; });
    }

    function applyCandleStyle() {
      if (!niftyChart) return;
      niftyChart.setStyles({
        candle: { type: niftyChartKind === "line" ? "area" : "candle_solid" },
      });
    }

    function restoreIndicators() {
      if (!niftyChart) return;
      if (!chartHasVol) {
        try {
          niftyChart.createIndicator("VOL", false, { height: 72 });
        } catch (_) {}
        chartHasVol = true;
      }
      chartOverlayIndicators.forEach((name) => {
        if (chartIndicatorPanes[name]) return;
        try {
          const paneId = niftyChart.createIndicator(name, true, { id: "candle_pane" });
          chartIndicatorPanes[name] = paneId || "candle_pane";
        } catch (_) {}
      });
      chartPaneIndicators.forEach((name) => {
        if (chartIndicatorPanes[name]) return;
        try {
          const opts = name === "FUTOI" ? { height: 64 } : undefined;
          chartIndicatorPanes[name] = opts
            ? niftyChart.createIndicator(name, false, opts)
            : niftyChart.createIndicator(name);
        } catch (_) {}
      });
    }

    function updateDrawModeChip() {
      const el = document.getElementById("chartDrawMode");
      if (!el) return;
      if (chartDrawTool) {
        el.hidden = false;
        el.textContent = `Drawing on · ${drawToolLabel()} · ${chartDrawLineSize}px · ${chartDrawLineColor} · magnet`;
      } else {
        el.hidden = true;
        el.textContent = "";
      }
    }

    function clearAutoSessionOverlays() {
      if (!niftyChart) return;
      overlayIgnore = true;
      try {
        niftyChart.removeOverlay({ groupId: "session-marks" });
      } catch (_) {}
      overlayIgnore = false;
    }

    function dropChartPriceLine(price, label) {
      const px = Number(price);
      if (!Number.isFinite(px) || !ensureChart()) return;
      registerChartExtras();
      const id = `sheet_${String(label || "lvl").replace(/\s+/g, "_")}_${px}`;
      try {
        niftyChart.removeOverlay({ id });
      } catch (_) {}
      try {
        niftyChart.createOverlay(overlayDrawOptions("priceLine", {
          id,
          groupId: "sheet-levels",
          points: [{ value: px }],
          extendData: label || String(px),
        }));
        pushOverlayHistory();
        showChartToast(`${label || "Level"} · ${px.toFixed(2)}`);
      } catch (_) {}
    }

    function hideNativeChartLabels() {
      if (!niftyChart) return;
      try {
        const theme = document.body.getAttribute("data-theme") || "dark";
        const dark = theme !== "light";
        const grid = dark ? "#2d3a4d" : "#d5dde8";
        const text = dark ? "#8b9cb3" : "#64748b";
        niftyChart.setStyles({
          candle: {
            tooltip: {
              showRule: "none",
              showType: "standard",
              text: { size: 0, color: "transparent" },
            },
          },
          indicator: {
            tooltip: {
              showRule: "always",
              showName: true,
              showParams: true,
              text: { size: 11, family: "ui-monospace, monospace", weight: "bold", color: text },
            },
          },
          crosshair: {
            show: true,
            horizontal: {
              show: true,
              line: { show: true, style: "dashed", dashedValue: [4, 2], size: 1, color: text },
              text: { show: true, color: "#ffffff", borderColor: grid, backgroundColor: dark ? "#1e293b" : "#475569" },
            },
            vertical: {
              show: true,
              line: { show: true, style: "dashed", dashedValue: [4, 2], size: 1, color: text },
              text: { show: true, color: "#ffffff", borderColor: grid, backgroundColor: dark ? "#1e293b" : "#475569" },
            },
          },
          overlay: {
            point: {
              color: "transparent",
              borderColor: "transparent",
              borderSize: 0,
              radius: 0,
              activeRadius: 4,
            },
          },
        });
      } catch (_) {}
    }

    function ensureChart() {
      const host = document.getElementById("klineHost");
      if (!host || typeof klinecharts === "undefined") return false;
      if (niftyChart && !niftyChart._atlasHudOnly) {
        disposeChart();
      }
      if (niftyChart) return true;
      if (host.clientWidth < 8 || host.clientHeight < 8) return false;
      registerChartExtras();
      const theme = document.body.getAttribute("data-theme") || "dark";
      niftyChart = klinecharts.init(host, {
        locale: "en-US",
        timezone: "Asia/Kolkata",
        styles: klineStyles(theme),
        customApi: { formatDate: formatKlineDate },
      });
      niftyChart._atlasHudOnly = true;
      captureChartDefaults();
      if (typeof niftyChart.setTimezone === "function") {
        niftyChart.setTimezone("Asia/Kolkata");
      }
      applyCandleStyle();
      hideNativeChartLabels();
      bindChartHud();
      if (!chartResizeObs) {
        chartResizeObs = new ResizeObserver(() => {
          if (niftyChart && typeof niftyChart.resize === "function") {
            niftyChart.resize();
          }
        });
        chartResizeObs.observe(host);
      }
      return true;
    }

    function paintChart() {
      if (typeof klinecharts === "undefined") {
        setChartEmpty("Chart library failed to load.");
        return;
      }
      if (!ensureChart()) {
        setChartEmpty("Loading…");
        return;
      }
      const bars = toKline(viewBars());
      if (!bars.length) {
        setChartEmpty(`Waiting for Kite ${notebookLabel()} candles. Feed must be live.`);
        niftyChart.applyNewData([]);
        return;
      }
      setChartEmpty("");
      niftyChart.applyNewData(bars);
      chartHasFullData = true;
      hideNativeChartLabels();
      clearAutoSessionOverlays();
      restoreIndicators();
      if (bars.length) {
        const last = bars[bars.length - 1];
        renderOhlcHud(last);
        checkPriceAlerts(bars);
      }
    }

    function mergeCandleBars(incoming) {
      if (!incoming || !incoming.length) return false;
      const byTime = new Map(niftyRawBars.map((b) => [b.time, b]));
      let changed = false;
      for (const bar of incoming) {
        if (!bar || bar.time == null) continue;
        const prev = byTime.get(bar.time);
        if (
          !prev
          || prev.open !== bar.open
          || prev.high !== bar.high
          || prev.low !== bar.low
          || prev.close !== bar.close
          || prev.volume !== bar.volume
          || prev.adx !== bar.adx
          || prev.pdi !== bar.pdi
          || prev.mdi !== bar.mdi
        ) {
          changed = true;
        }
        byTime.set(bar.time, { ...bar });
      }
      if (!changed) return false;
      niftyRawBars = Array.from(byTime.values()).sort((a, b) => a.time - b.time);
      if (niftyRawBars.length > 2000) niftyRawBars = niftyRawBars.slice(-2000);
      niftyLastBarTime = niftyRawBars[niftyRawBars.length - 1].time;
      syncServerDmiMap(niftyRawBars);
      return true;
    }

    function paintChartLive() {
      if (!chartHasFullData || !niftyChart || typeof niftyChart.updateData !== "function") {
        paintChart();
        return;
      }
      const bars = toKline(viewBars());
      if (!bars.length) {
        paintChart();
        return;
      }
      try {
        niftyChart.updateData(bars[bars.length - 1]);
      } catch (_) {
        paintChart();
        return;
      }
      hideNativeChartLabels();
      renderOhlcHud(bars[bars.length - 1]);
      checkPriceAlerts(bars);
    }

    function applyLiveCandleBars(incoming) {
      if (!niftyRawBars.length) return;
      if (mergeCandleBars(incoming)) paintChartLive();
    }

    function applyChartTheme() {
      disposeChart();
      renderDrawBar();
      paintChart();
    }

    function startDrawTool(name) {
      if (!ensureChart()) return;
      registerChartExtras();
      chartDrawTool = name;
      renderDrawBar();
      try {
        niftyChart.createOverlay(overlayDrawOptions(name));
      } catch (_) {
        try {
          niftyChart.createOverlay(name);
        } catch (__) {}
      }
    }

    function clearDrawings() {
      if (!niftyChart) return;
      try {
        niftyChart.removeOverlay();
      } catch (_) {}
      chartDrawTool = null;
      pushOverlayHistory();
      renderDrawBar();
    }

    function readChartBarSpace() {
      if (!niftyChart || typeof niftyChart.getBarSpace !== "function") return chartDefaultBarSpace;
      try {
        const space = niftyChart.getBarSpace();
        if (typeof space === "number" && space > 0) return space;
        if (space && typeof space.bar === "number" && space.bar > 0) return space.bar;
      } catch (_) {}
      return chartDefaultBarSpace;
    }

    function captureChartDefaults() {
      const space = readChartBarSpace();
      if (space > 0) chartDefaultBarSpace = space;
      if (niftyChart && typeof niftyChart.getOffsetRightDistance === "function") {
        try {
          const dist = niftyChart.getOffsetRightDistance();
          if (Number.isFinite(dist)) chartDefaultOffsetRight = dist;
        } catch (_) {}
      }
    }

    function resetChartView() {
      if (!ensureChart()) return;
      chartDrawTool = null;
      try {
        if (typeof niftyChart.setBarSpace === "function") {
          niftyChart.setBarSpace(chartDefaultBarSpace);
        }
        if (typeof niftyChart.setOffsetRightDistance === "function") {
          niftyChart.setOffsetRightDistance(chartDefaultOffsetRight);
        }
        if (typeof niftyChart.scrollToRealTime === "function") {
          niftyChart.scrollToRealTime();
        }
      } catch (_) {}
      renderDrawBar();
    }

    function toggleIndicator(name, onCandle) {
      if (!ensureChart()) return;
      const bag = onCandle ? chartOverlayIndicators : chartPaneIndicators;
      if (bag.has(name)) {
        const paneId = chartIndicatorPanes[name] || (onCandle ? "candle_pane" : undefined);
        try {
          niftyChart.removeIndicator(paneId, name);
        } catch (_) {
          try { niftyChart.removeIndicator(name); } catch (__) {}
        }
        delete chartIndicatorPanes[name];
        bag.delete(name);
      } else {
        try {
          const paneId = onCandle
            ? niftyChart.createIndicator(name, true, { id: "candle_pane" })
            : niftyChart.createIndicator(name);
          chartIndicatorPanes[name] = paneId || (onCandle ? "candle_pane" : undefined);
          bag.add(name);
        } catch (_) {}
      }
      renderChartToolbar();
    }

    function closeChartMenu(panelId, toggleId) {
      const panel = document.getElementById(panelId);
      const toggle = document.getElementById(toggleId);
      if (!panel || !toggle) return;
      panel.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
      if (toggleId === "chartDrawToggle") {
        toggle.classList.toggle("active", !!chartDrawTool);
      } else if (toggleId === "chartLineSizeToggle" || toggleId === "chartLineColorToggle") {
        toggle.classList.toggle("active", isLineDrawTool(chartDrawTool));
      } else {
        toggle.classList.remove("active");
      }
    }

    function toggleChartMenu(panelId, toggleId, event) {
      if (event) event.stopPropagation();
      const panel = document.getElementById(panelId);
      const toggle = document.getElementById(toggleId);
      if (!panel || !toggle) return;
      const open = panel.hidden;
      [
        ["chartDrawPanel", "chartDrawToggle"],
        ["chartIndicatorPanel", "chartIndicatorToggle"],
        ["chartLineSizePanel", "chartLineSizeToggle"],
        ["chartLineColorPanel", "chartLineColorToggle"],
      ].forEach(([pid, tid]) => {
        if (pid !== panelId) closeChartMenu(pid, tid);
      });
      panel.hidden = !open;
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.classList.toggle(
        "active",
        open
          || (toggleId === "chartDrawToggle" && !!chartDrawTool)
          || ((toggleId === "chartLineSizeToggle" || toggleId === "chartLineColorToggle") && isLineDrawTool(chartDrawTool)),
      );
      if (open && panelId === "chartIndicatorPanel") {
        const searchInput = document.getElementById("chartIndicatorSearch");
        if (searchInput) {
          setTimeout(() => searchInput.focus(), 50);
        }
      }
    }

    function isLineDrawTool(name) {
      return LINE_DRAW_TOOLS.has(name);
    }

    function hslToHex(h, s, l) {
      const sat = s / 100;
      const light = l / 100;
      const a = sat * Math.min(light, 1 - light);
      const f = (n) => {
        const k = (n + h / 30) % 12;
        const color = light - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, "0");
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function buildHoneycombPalette(rings = HONEYCOMB_RINGS, size = HONEYCOMB_SIZE) {
      const cells = [];
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      const w = size;
      const h = size * 1.1547;
      for (let q = -rings; q <= rings; q++) {
        for (let r = -rings; r <= rings; r++) {
          const s = -q - r;
          const dist = Math.max(Math.abs(q), Math.abs(r), Math.abs(s));
          if (dist > rings) continue;
          const x = w * (Math.sqrt(3) * q + (Math.sqrt(3) / 2) * r);
          const y = h * (0.75 * r);
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          let color = "#ffffff";
          if (dist > 0) {
            const hue = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            const sat = Math.min(100, 35 + dist * 11);
            const light = Math.max(18, 94 - dist * 11);
            color = hslToHex(hue, sat, light);
          }
          cells.push({ x, y, color, dist });
        }
      }
      const padX = w / 2 + 2;
      const padY = h / 2 + 2;
      return {
        width: Math.ceil(maxX - minX + padX * 2),
        height: Math.ceil(maxY - minY + padY * 2),
        cells: cells.map((cell) => ({
          color: cell.color,
          left: cell.x - minX + padX,
          top: cell.y - minY + padY,
        })),
      };
    }

    function getHoneycombPalette() {
      if (!honeycombPalette) honeycombPalette = buildHoneycombPalette();
      return honeycombPalette;
    }

    function rearmPendingLineDraw() {
      const tool = chartDrawTool;
      if (!tool || !isLineDrawTool(tool) || !niftyChart) return;
      try {
        listOverlays().forEach((ov) => {
          if (ov.name === tool && Number(ov.currentStep) < Number(ov.totalStep)) {
            try { niftyChart.removeOverlay({ id: ov.id }); } catch (_) {}
          }
        });
      } catch (_) {}
      try {
        niftyChart.createOverlay(overlayDrawOptions(tool));
      } catch (_) {}
    }

    function setDrawLineSize(size) {
      chartDrawLineSize = Math.min(5, Math.max(1, Number(size) || 1));
      rearmPendingLineDraw();
      renderDrawBar();
    }

    function setDrawLineColor(color) {
      if (!color) return;
      chartDrawLineColor = String(color);
      rearmPendingLineDraw();
      renderDrawBar();
    }

    function drawToolLabel() {
      const item = DRAW_TOOLS.find((row) => row.id === chartDrawTool);
      return item ? item.name : "Draw";
    }

    function renderLineStyleControls() {
      const styleWrap = document.getElementById("chartLineStyle");
      const sizeToggle = document.getElementById("chartLineSizeToggle");
      const sizePanel = document.getElementById("chartLineSizePanel");
      const colorToggle = document.getElementById("chartLineColorToggle");
      const colorDot = document.getElementById("chartLineColorDot");
      const colorPanel = document.getElementById("chartLineColorPanel");
      const honeycomb = document.getElementById("chartHoneycomb");
      if (!styleWrap || !sizeToggle || !sizePanel || !colorToggle || !honeycomb) return;
      const showStyle = isLineDrawTool(chartDrawTool);
      styleWrap.hidden = !showStyle;
      if (!showStyle) {
        sizePanel.hidden = true;
        if (colorPanel) colorPanel.hidden = true;
        sizeToggle.setAttribute("aria-expanded", "false");
        colorToggle.setAttribute("aria-expanded", "false");
        sizeToggle.classList.remove("active");
        colorToggle.classList.remove("active");
        return;
      }
      sizeToggle.innerHTML = `<span>${chartDrawLineSize}px</span>`;
      sizeToggle.classList.toggle("active", !sizePanel.hidden);
      sizePanel.innerHTML = DRAW_LINE_SIZES.map((size) =>
        `<button type="button" class="chart-menu-item${chartDrawLineSize === size ? " active" : ""}" data-line-size="${size}"><span class="line-weight" style="--swatch-h:${size}px;--swatch:${chartDrawLineColor}"></span><span>${size}px</span></button>`,
      ).join("");
      sizePanel.querySelectorAll("[data-line-size]").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          setDrawLineSize(btn.getAttribute("data-line-size"));
          closeChartMenu("chartLineSizePanel", "chartLineSizeToggle");
        });
      });
      if (colorDot) colorDot.style.setProperty("--swatch", chartDrawLineColor);
      colorToggle.classList.toggle("active", !(colorPanel && colorPanel.hidden));
      const palette = getHoneycombPalette();
      honeycomb.style.setProperty("--honey-w", `${palette.width}px`);
      honeycomb.style.setProperty("--honey-h", `${palette.height}px`);
      honeycomb.style.setProperty("--honey-size", `${HONEYCOMB_SIZE}px`);
      honeycomb.innerHTML = palette.cells.map((cell) =>
        `<button type="button" class="chart-honey-cell${chartDrawLineColor.toLowerCase() === cell.color.toLowerCase() ? " active" : ""}" data-line-color="${cell.color}" style="left:${cell.left}px;top:${cell.top}px;--swatch:${cell.color}" title="${cell.color}" aria-label="Line color ${cell.color}"></button>`,
      ).join("");
      honeycomb.querySelectorAll("[data-line-color]").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          setDrawLineColor(btn.getAttribute("data-line-color"));
          closeChartMenu("chartLineColorPanel", "chartLineColorToggle");
        });
      });
    }

    function renderDrawBar() {
      const panel = document.getElementById("chartDrawPanel");
      const toggle = document.getElementById("chartDrawToggle");
      const clearBtn = document.getElementById("chartDrawClear");
      const resetBtn = document.getElementById("chartResetBtn");
      const undoBtn = document.getElementById("chartDrawUndo");
      const redoBtn = document.getElementById("chartDrawRedo");
      if (!panel || !toggle || !clearBtn) return;
      toggle.innerHTML = `${chartIcon("draw")}<span>${drawToolLabel()}</span>`;
      toggle.classList.toggle("active", !!chartDrawTool);
      updateDrawModeChip();
      renderLineStyleControls();
      panel.innerHTML = DRAW_GROUPS.map((group) =>
        `<div class="chart-menu-heading">${group.heading}</div>` +
        group.tools.map((item) =>
          `<button type="button" class="chart-menu-item${chartDrawTool === item.id ? " active" : ""}" data-draw="${item.id}">${drawIcon(item.id)}<span>${item.name}</span></button>`,
        ).join(""),
      ).join("");
      panel.querySelectorAll("[data-draw]").forEach((btn) => {
        btn.addEventListener("click", () => {
          startDrawTool(btn.getAttribute("data-draw"));
          closeChartMenu("chartDrawPanel", "chartDrawToggle");
        });
      });
      if (undoBtn && !undoBtn.dataset.ready) {
        undoBtn.dataset.ready = "1";
        undoBtn.innerHTML = chartIcon("undo");
        undoBtn.addEventListener("click", () => {
          if (typeof undoDrawing === "function") undoDrawing();
        });
      }
      if (redoBtn && !redoBtn.dataset.ready) {
        redoBtn.dataset.ready = "1";
        redoBtn.innerHTML = chartIcon("redo");
        redoBtn.addEventListener("click", () => {
          if (typeof redoDrawing === "function") redoDrawing();
        });
      }
      if (undoBtn) undoBtn.disabled = typeof overlayHistory === "undefined" || overlayHistory.length < 2;
      if (redoBtn) redoBtn.disabled = typeof overlayRedo === "undefined" || !overlayRedo.length;
      if (!clearBtn.dataset.ready) {
        clearBtn.dataset.ready = "1";
        setToolButton(clearBtn, "clear", "Clear");
        clearBtn.addEventListener("click", clearDrawings);
      }
      if (resetBtn && !resetBtn.dataset.ready) {
        resetBtn.dataset.ready = "1";
        setToolButton(resetBtn, "reset", "Reset");
        resetBtn.addEventListener("click", resetChartView);
      }
      const sizeToggle = document.getElementById("chartLineSizeToggle");
      const colorToggle = document.getElementById("chartLineColorToggle");
      if (sizeToggle && !sizeToggle.dataset.ready) {
        sizeToggle.dataset.ready = "1";
        sizeToggle.addEventListener("click", (event) => {
          toggleChartMenu("chartLineSizePanel", "chartLineSizeToggle", event);
        });
      }
      if (colorToggle && !colorToggle.dataset.ready) {
        colorToggle.dataset.ready = "1";
        colorToggle.addEventListener("click", (event) => {
          toggleChartMenu("chartLineColorPanel", "chartLineColorToggle", event);
        });
      }
    }

    let chartIndicatorFilter = "";

    function renderIndicatorList() {
      const list = document.getElementById("chartIndicatorList");
      if (!list) return;
      const q = chartIndicatorFilter.trim().toLowerCase();
      const overlayItems = OVERLAY_INDICATORS.map((name) => ({ name, onCandle: true }));
      const paneItems = PANE_INDICATORS.map((name) => ({ name, onCandle: false }));

      function matchesFilter(item) {
        if (!q) return true;
        const code = item.name.toLowerCase();
        const label = (INDICATOR_NAMES[item.name] || "").toLowerCase();
        return code.includes(q) || label.includes(q);
      }

      const filteredOverlay = overlayItems.filter(matchesFilter);
      const filteredPane = paneItems.filter(matchesFilter);

      function indicatorRows(items) {
        return items.map((item) => {
          const checked = (item.onCandle ? chartOverlayIndicators : chartPaneIndicators).has(item.name);
          return `<label class="chart-menu-item">
            <input type="checkbox" data-ind="${item.name}" data-on-candle="${item.onCandle ? "1" : "0"}"${checked ? " checked" : ""}>
            ${indicatorIcon(item.name)}
            <span>${INDICATOR_NAMES[item.name] || item.name}</span>
          </label>`;
        }).join("");
      }

      if (!filteredOverlay.length && !filteredPane.length) {
        list.innerHTML = `<div class="chart-indicator-empty">No indicators matching "${escapeHtml(q)}"</div>`;
        return;
      }

      let html = "";
      if (filteredOverlay.length) {
        html += `<div class="chart-menu-heading">On price</div>${indicatorRows(filteredOverlay)}`;
      }
      if (filteredPane.length) {
        html += `<div class="chart-menu-heading">Panes</div>${indicatorRows(filteredPane)}`;
      }
      list.innerHTML = html;

      list.querySelectorAll("input").forEach((box) => {
        box.addEventListener("change", () => {
          toggleIndicator(box.getAttribute("data-ind"), box.getAttribute("data-on-candle") === "1");
        });
      });
    }

    function renderChartToolbar() {
      const intervalBar = document.getElementById("chartIntervalBar");
      const styleBar = document.getElementById("chartStyleBar");
      const searchInput = document.getElementById("chartIndicatorSearch");
      const searchClear = document.getElementById("chartIndicatorSearchClear");

      if (searchInput && !searchInput.dataset.ready) {
        searchInput.dataset.ready = "1";
        searchInput.addEventListener("input", (e) => {
          chartIndicatorFilter = e.target.value;
          if (searchClear) searchClear.hidden = !chartIndicatorFilter;
          renderIndicatorList();
        });
        searchInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (chartIndicatorFilter) {
              chartIndicatorFilter = "";
              searchInput.value = "";
              if (searchClear) searchClear.hidden = true;
              renderIndicatorList();
            } else {
              closeChartMenu("chartIndicatorPanel", "chartIndicatorToggle");
            }
          }
        });
      }
      if (searchClear && !searchClear.dataset.ready) {
        searchClear.dataset.ready = "1";
        searchClear.addEventListener("click", () => {
          chartIndicatorFilter = "";
          if (searchInput) {
            searchInput.value = "";
            searchInput.focus();
          }
          searchClear.hidden = true;
          renderIndicatorList();
        });
      }

      intervalBar.innerHTML = CHART_INTERVALS.map(
        (item) =>
          `<button type="button" class="chart-tool-btn${item.id === niftyInterval ? " active" : ""}" data-interval="${item.id}">${chartIcon(item.id === 0 ? "day" : "clock")}<span>${item.label}</span></button>`,
      ).join("");
      styleBar.innerHTML = CHART_STYLES.map(
        (item) =>
          `<button type="button" class="chart-tool-btn${item.id === niftyChartKind ? " active" : ""}" data-style="${item.id}">${chartIcon(item.id)}<span>${item.label}</span></button>`,
      ).join("");

      renderIndicatorList();

      const count = chartOverlayIndicators.size + chartPaneIndicators.size;
      const toggle = document.getElementById("chartIndicatorToggle");
      setToolButton(toggle, "indicators", count ? `Indicators (${count})` : "Indicators");
      intervalBar.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          niftyInterval = Number(btn.getAttribute("data-interval"));
          renderChartToolbar();
          paintChart();
        });
      });
      styleBar.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          niftyChartKind = btn.getAttribute("data-style");
          renderChartToolbar();
          applyCandleStyle();
          paintChart();
        });
      });
    }

    function chartIntervalLabel() {
      const item = CHART_INTERVALS.find((row) => row.id === niftyInterval);
      return item ? item.label : "1m";
    }

    function chartShotFilename() {
      const stamp = new Date()
        .toLocaleString("sv-SE", { timeZone: "Asia/Kolkata" })
        .replace(/[: ]/g, "-")
        .slice(0, 16);
      return `NIFTY50-${chartIntervalLabel()}-${stamp}.png`;
    }

    function captureChartImage() {
      const theme = document.body.getAttribute("data-theme") || "dark";
      const bg = theme === "light" ? "#ffffff" : "#1a2332";
      if (niftyChart && typeof niftyChart.getConvertPictureUrl === "function") {
        try {
          return niftyChart.getConvertPictureUrl(true, "png", bg) || "";
        } catch (_) {
          try {
            return niftyChart.getConvertPictureUrl(true, "jpeg", bg) || "";
          } catch (__) {}
        }
      }
      const host = document.getElementById("klineHost");
      const canvas = host && host.querySelector("canvas");
      if (!canvas) return "";
      try {
        return canvas.toDataURL("image/png");
      } catch (_) {
        return "";
      }
    }

    async function saveChartScreenshot() {
      const url = captureChartImage();
      if (!url) return;
      const name = chartShotFilename();
      let blob;
      try {
        blob = await (await fetch(url)).blob();
      } catch (_) {
        return;
      }
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: name,
            types: [{ description: "PNG image", accept: { "image/png": [".png"] } }],
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    async function refreshNiftyCandles() {
      if (document.visibilityState === "hidden") return;
      try {
        const params = new URLSearchParams({ nb: notebookId });
        if (niftyLastBarTime != null && niftyRawBars.length) {
          params.set("since", String(niftyLastBarTime));
        }
        const resp = await fetch(`/api/candles?${params.toString()}`);
        if (!resp.ok) {
          setChartEmpty("Candle API not ready. Restart Atlas Lite (./run.sh), then refresh this page.");
          return;
        }
        const data = await resp.json();
        const incoming = Array.isArray(data.bars) ? data.bars : [];
        const hadBars = niftyRawBars.length > 0;
        if (data.delta && hadBars) {
          mergeCandleBars(incoming);
          paintChartLive();
        } else {
          niftyRawBars = incoming;
          if (niftyRawBars.length) {
            niftyLastBarTime = niftyRawBars[niftyRawBars.length - 1].time;
          }
          syncServerDmiMap(niftyRawBars);
          paintChart();
        }
      } catch (_) {
        setChartEmpty(`Could not load ${notebookLabel()} candles from Kite.`);
      }
    }

    function stopCandlePoll() {
      if (candlePollTimer != null) {
        clearInterval(candlePollTimer);
        candlePollTimer = null;
      }
    }

    function startCandlePoll() {
      stopCandlePoll();
      candlePollTimer = setInterval(() => { refreshNiftyCandles(); }, 5000);
    }

    function formatPaperInr(value, digits) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      return "₹" + n.toLocaleString("en-IN", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
    }

    function paperStrategyLabel(strategy) {
      if (strategy === "short_iron_fly") return "Iron fly";
      if (strategy === "long_straddle") return "Long straddle";
      return "Sit";
    }

    function renderPaperBar(data) {
      const host = document.getElementById("paperBar");
      if (!host) return;
      if (notebookId !== "nifty") {
        host.hidden = true;
        return;
      }
      if (!data || data.enabled === false) {
        host.hidden = true;
        host.innerHTML = "";
        return;
      }
      host.hidden = false;
      const pos = data.position;
      const regime = data.regime;
      const mtm = Number(data.mtm_pnl);
      const mtmCls = mtm > 0 ? "paper-up" : mtm < 0 ? "paper-dn" : "";
      let book = "Flat";
      if (pos) {
        const kind = paperStrategyLabel(pos.strategy);
        const atm = pos.atm != null ? `ATM ${pos.atm}` : "ATM —";
        if (pos.strategy === "short_iron_fly") {
          const credit = pos.credit != null ? ` · cr ${Number(pos.credit).toFixed(1)}` : "";
          book = `${kind} ${atm} ±${pos.wing_pts || 250}${credit}`;
        } else {
          book = `${kind} ${atm}`;
        }
      }
      const want = regime ? paperStrategyLabel(regime) : (data.fly_ready ? "Fly ready" : data.tape_ready ? "Long ready" : "Sit");
      const entries = `${data.entries_today ?? 0}/${data.max_entries_per_day ?? 5}`;
      const failing = [
        ...(data.fly_failing || []).map((g) => `Fly: ${g}`),
        ...(data.tape_failing || []).map((g) => `Long: ${g}`),
      ];
      const missing = [
        ...(data.fly_missing || []).map((g) => `Fly missing: ${g}`),
        ...(data.tape_missing || []).map((g) => `Long missing: ${g}`),
      ];
      const tipBits = [];
      if (failing.length) tipBits.push(failing.join(" · "));
      if (missing.length) tipBits.push(missing.join(" · "));
      if (!pos && !tipBits.length) tipBits.push("Paper idle · no live orders");
      const win = data.tape_in_window ? "in window" : (data.entry_window || "09:15-15:14");
      host.title = tipBits.join(" · ");
      host.innerHTML = [
        `<span class="paper-k">Paper</span>`,
        `<span>${escapeHtml(want)}</span>`,
        `<span>${escapeHtml(book)}</span>`,
        `<span class="${mtmCls}">MTM ${escapeHtml(formatPaperInr(mtm, 0))}</span>`,
        `<span>Eq ${escapeHtml(formatPaperInr(data.equity, 0))}</span>`,
        `<span>${escapeHtml(entries)} · ${escapeHtml(win)}</span>`,
      ].join("");
    }

    async function loadPaperSnapshot() {
      if (document.visibilityState === "hidden") return;
      if (notebookId !== "nifty") {
        const host = document.getElementById("paperBar");
        if (host) host.hidden = true;
        return;
      }
      try {
        const resp = await fetch("/api/paper");
        if (!resp.ok) return;
        renderPaperBar(await resp.json());
      } catch (_) {
        /* keep last paint */
      }
    }

    function stopPaperPoll() {
      if (paperPollTimer != null) {
        clearInterval(paperPollTimer);
        paperPollTimer = null;
      }
    }

    function startPaperPoll() {
      stopPaperPoll();
      paperPollTimer = setInterval(() => { loadPaperSnapshot(); }, PAPER_POLL_MS);
    }

    function updateModalScrollLock() {
      const anyOpen = document.getElementById("historyModal").classList.contains("open");
      document.body.style.overflow = anyOpen ? "hidden" : "";
    }

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY) || "dark";
      document.body.setAttribute("data-theme", saved);
      updateThemeToggle(saved);
    }

    function updateThemeToggle(theme) {
      const btn = document.getElementById("themeToggle");
      const isDark = theme === "dark";
      btn.textContent = isDark ? "☀" : "☾";
      btn.title = isDark ? "Switch to light theme" : "Switch to dark theme";
      btn.setAttribute("aria-label", btn.title);
    }

    function toggleTheme() {
      const next = document.body.getAttribute("data-theme") === "light" ? "dark" : "light";
      document.body.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);

    document.getElementById("themeToggle").addEventListener("click", toggleTheme);
    document.getElementById("chartShotBtn").addEventListener("click", saveChartScreenshot);
    document.getElementById("chartIndicatorToggle").addEventListener("click", (event) => {
      toggleChartMenu("chartIndicatorPanel", "chartIndicatorToggle", event);
    });
    document.getElementById("chartDrawToggle").addEventListener("click", (event) => {
      toggleChartMenu("chartDrawPanel", "chartDrawToggle", event);
    });
    document.addEventListener("click", (event) => {
      const drawMenu = document.getElementById("chartDrawMenu");
      const indicatorMenu = document.getElementById("chartIndicatorMenu");
      const sizeMenu = document.getElementById("chartLineSizeMenu");
      const colorMenu = document.getElementById("chartLineColorMenu");
      if (!drawMenu || !drawMenu.contains(event.target)) {
        closeChartMenu("chartDrawPanel", "chartDrawToggle");
      }
      if (!indicatorMenu || !indicatorMenu.contains(event.target)) {
        closeChartMenu("chartIndicatorPanel", "chartIndicatorToggle");
      }
      if (!sizeMenu || !sizeMenu.contains(event.target)) {
        closeChartMenu("chartLineSizePanel", "chartLineSizeToggle");
      }
      if (!colorMenu || !colorMenu.contains(event.target)) {
