      }
    });
    document.addEventListener("pointerdown", unlockParityAudio);
    document.addEventListener("keydown", unlockParityAudio);
    initTheme();

    const HISTORY_PAGE = 200;

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    let recordingOffset = 0;
    let recordingTotal = 0;
    let recordingEntries = [];
    let recordingScope = "file";
    let recordingDayLabel = "";
    let recordingFileCount = 0;

    function formatLiveTimestamp(ms) {
      if (!ms) return "—";
      const ts = new Date(ms);
      if (Number.isNaN(ts.getTime())) return "—";
      return ts.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true,
      }) + " IST";
    }

    function formatRecordingTs(ts) {
      if (!ts) return "—";
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return ts;
      return d.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        fractionalSecondDigits: 3,
        hour12: true,
      }) + " IST";
    }

    function formatHistMetric(value, id) {
      if (value == null || Number.isNaN(value)) return "—";
      if (id === "pcr") return Number(value).toFixed(3);
      if (id === "ivp" || id === "oi_pct_chg" || id === "oi_day_high") return Number(value).toFixed(1) + "%";
      if (id === "ce" || id === "pe" || id === "adx") return Number(value).toFixed(2);
      if (id === "spot") return Number(value).toLocaleString("en-IN", { maximumFractionDigits: 2 });
      return String(value);
    }

    function formatRecordingDetail(entry) {
      const feed = entry.feed || {};
      const evaln = entry.evaluation || {};
      const indices = entry.indices || [];
      const lines = [
        `Time: ${entry.ts || "—"}`,
        `Spot: ${formatHistMetric(entry.spot, "spot")} · ATM ${entry.atm_strike ?? "—"}`,
        "",
        "— Metrics —",
        `ADX: ${formatHistMetric(feed.adx, "adx")} · ATR: ${formatHistMetric(feed.atr, "atr")}`,
        `VIX chg: ${formatHistMetric(feed.vix_chg, "vix_chg")} · IVP: ${formatHistMetric(feed.ivp, "ivp")}`,
        `PCR: ${formatHistMetric(feed.pcr, "pcr")} · Max pain: ${formatHistMetric(feed.max_pain, "max_pain")}`,
        `CE: ${formatHistMetric(feed.ce, "ce")} · PE: ${formatHistMetric(feed.pe, "pe")}`,
        `IV: ${formatHistMetric(feed.iv, "iv")} · Low ${formatHistMetric(feed.iv_day_low, "iv")} · High ${formatHistMetric(feed.iv_day_high, "iv")}`,
        `OI vs high: ${formatHistMetric(feed.oi_vs_day_high ?? feed.oi_pct_chg, feed.oi_vs_day_high != null ? "oi_day_high" : "oi_pct_chg")}`,
        "",
        "— Indices —",
      ];
      for (const idx of indices) {
        lines.push(
          `${idx.label}: ${formatHistMetric(idx.ltp, "spot")} (${formatHistMetric(idx.chg_pts, "spot")} / ${idx.chg_pct != null ? idx.chg_pct.toFixed(3) + "%" : "—"})`,
        );
      }
      lines.push("", "— Gates —");
      for (const row of evaln.rows || []) {
        const mark = row.passed === true ? "PASS" : row.passed === false ? "FAIL" : "—";
        lines.push(`${row.label}: ${formatHistMetric(row.value, row.id)} → ${mark}`);
      }
      if ((entry.live_warnings || []).length) {
        lines.push("", "— Warnings —", ...entry.live_warnings);
      }
      return lines.join("\n");
    }

    function renderRecordingRows(entries) {
      const tbody = document.getElementById("recordingRows");
      if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="hist-muted">No snapshots match these filters</td></tr>';
        document.getElementById("recordingDetail").textContent = "No data.";
        return;
      }
      tbody.innerHTML = entries.map((entry, i) => {
        const feed = entry.feed || {};
        const evaln = entry.evaluation || {};
        const ready = evaln.entry_ready;
        const entryCls = ready ? "hist-pass hist-entry" : "hist-fail hist-entry";
        const entryText = ready
          ? "READY"
          : '<span class="hist-entry-line">NOT</span><span class="hist-entry-line">READY</span>';
        const src = entry.file ? ` title="${escapeHtml(entry.file)}"` : "";
        const gates = `${evaln.passed ?? 0}/${evaln.gates_total ?? evaln.evaluable ?? 0}`;
        return `<tr data-idx="${i}"${src}>
          <td>${formatRecordingTs(entry.ts)}</td>
          <td>${formatHistMetric(entry.spot, "spot")}</td>
          <td>${formatHistMetric(feed.adx, "adx")}</td>
          <td>${formatHistMetric(feed.pcr, "pcr")}</td>
          <td>${formatHistMetric(feed.ivp, "ivp")}</td>
          <td>${formatHistMetric(feed.ce, "ce")}</td>
          <td>${formatHistMetric(feed.pe, "pe")}</td>
          <td class="${entryCls}">${entryText}</td>
          <td>${gates}</td>
        </tr>`;
      }).join("");
      tbody.querySelectorAll("tr[data-idx]").forEach((row) => {
        row.addEventListener("click", () => {
          tbody.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
          row.classList.add("selected");
          const idx = Number(row.getAttribute("data-idx"));
          document.getElementById("recordingDetail").textContent =
            formatRecordingDetail(recordingEntries[idx]);
        });
      });
    }

    function updateRecordingMeta(name) {
      const meta = document.getElementById("recordingMeta");
      if (!name && recordingScope !== "day") {
        meta.textContent = "Select a 30-minute recording file";
        return;
      }
      const bits = [];
      const entry = document.getElementById("historyEntryFilter")?.value;
      const gates = document.getElementById("historyGatesFilter")?.value;
      const failing = document.getElementById("historyFailingFilter")?.value;
      if (entry && entry !== "all") bits.push(entry === "ready" ? "READY" : "NOT READY");
      if (gates && gates !== "all") bits.push(gates === "le4" ? "≤4/7" : `${gates}/7`);
      if (failing) bits.push(`fail ${failing}`);
      const filt = bits.length ? ` · ${bits.join(" · ")}` : "";
      const label = recordingScope === "day"
        ? `${recordingDayLabel}${recordingFileCount ? ` · ${recordingFileCount} files` : ""}`
        : name;
      if (!recordingTotal) {
        meta.textContent = `${label} · no matches${filt}`;
        return;
      }
      const end = Math.min(recordingOffset + recordingEntries.length, recordingTotal);
      meta.textContent = `${label} · showing ${recordingOffset + 1}-${end} of ${recordingTotal}${filt}`;
    }

    function formatRecordingSize(bytes) {
      const n = Number(bytes) || 0;
      if (n >= 1048576) return `${(n / 1048576).toFixed(1)} MB`;
      if (n >= 1024) return `${Math.round(n / 1024)} KB`;
      return `${n} B`;
    }

    function recordingDayFromName(name) {
      const m = String(name || "").match(/^(\d{4}-\d{2}-\d{2})_/);
      return m ? m[1] : "";
    }

    function triggerDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename || "";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function loadRecordingFiles(selectName) {
      const select = document.getElementById("recordingFile");
      const resp = await fetch("/api/recordings");
      const data = await resp.json();
      const files = data.files || [];
      select.innerHTML = files.length
        ? files.map(f => `<option value="${f.name}">${f.name} (${formatRecordingSize(f.size_bytes)})</option>`).join("")
        : '<option value="">No recordings yet</option>';
      if (selectName && files.some(f => f.name === selectName)) {
        select.value = selectName;
      } else if (files.length) {
        select.value = files[0].name;
      }
    }

    function historyFiltersActive() {
      const entry = document.getElementById("historyEntryFilter")?.value || "all";
      const gates = document.getElementById("historyGatesFilter")?.value || "all";
      const failing = document.getElementById("historyFailingFilter")?.value || "";
      return (entry && entry !== "all") || (gates && gates !== "all") || Boolean(failing);
    }

    function historyFilterQuery() {
      const params = new URLSearchParams();
      const entry = document.getElementById("historyEntryFilter")?.value || "all";
      const gates = document.getElementById("historyGatesFilter")?.value || "all";
      const failing = document.getElementById("historyFailingFilter")?.value || "";
      if (entry && entry !== "all") params.set("entry", entry);
      if (gates && gates !== "all") params.set("gates", gates);
      if (failing) params.set("failing", failing);
      const qs = params.toString();
      return qs ? `&${qs}` : "";
    }

    async function loadRecordingPage() {
      const name = document.getElementById("recordingFile").value;
      if (!name) return;
      const day = recordingDayFromName(name);
      const useDay = historyFiltersActive() && day;
      const url = useDay
        ? `/api/recordings/day/${encodeURIComponent(day)}?limit=${HISTORY_PAGE}&offset=${recordingOffset}${historyFilterQuery()}`
        : `/api/recordings/${encodeURIComponent(name)}?limit=${HISTORY_PAGE}&offset=${recordingOffset}${historyFilterQuery()}`;
      const resp = await fetch(url);
      if (!resp.ok) {
        document.getElementById("recordingMeta").textContent = "Failed to load recording";
        return;
      }
      const data = await resp.json();
      recordingTotal = data.total || 0;
      recordingEntries = data.entries || [];
      recordingScope = data.scope === "day" ? "day" : "file";
      recordingDayLabel = data.day || day || "";
      recordingFileCount = Number(data.file_count) || (data.files || []).length || 0;
      renderRecordingRows(recordingEntries);
      updateRecordingMeta(name);
      document.getElementById("recordingDetail").textContent = recordingEntries.length
        ? (recordingScope === "day"
          ? "Click a row for full snapshot. Hover a row to see its 30-minute file."
          : "Click a row for full snapshot.")
        : "No snapshots match these filters.";
    }

    async function setHistoryOpen(open) {
      const modal = document.getElementById("historyModal");
      const btn = document.getElementById("historyToggle");
      modal.classList.toggle("open", open);
      modal.setAttribute("aria-hidden", open ? "false" : "true");
      btn.classList.toggle("active", open);
      updateModalScrollLock();

          setHistoryOpen(false);

        return;
      }
      const mod = event.metaKey || event.ctrlKey;
      if (!mod || event.altKey) return;
      const key = String(event.key || "").toLowerCase();
      const tag = (event.target && event.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.target?.isContentEditable) return;
      if (key === "z" && !event.shiftKey) {
        event.preventDefault();
        undoDrawing();
      } else if (key === "y" || (key === "z" && event.shiftKey)) {
        event.preventDefault();
        redoDrawing();
      }
    });

    const CHAIN_POLL_MS = 1000;
    let chainPollTimer = null;
    let chainScrollPending = false;

    function formatChainNum(value, digits = 2) {
      if (value == null || Number.isNaN(value)) return "—";
      return Number(value).toLocaleString("en-IN", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
    }

    function formatChainOi(value) {
      if (value == null || Number.isNaN(value)) return "—";
      return Math.round(value).toLocaleString("en-IN");
    }

    function formatChainChg(value) {
      if (value == null || Number.isNaN(value)) return "—";
      const text = (value >= 0 ? "+" : "") + Number(value).toFixed(2) + "%";
      const cls = value > 0 ? "chain-up" : value < 0 ? "chain-down" : "chain-muted";
      return `<span class="${cls}">${text}</span>`;
    }

    function spotStrikeMarker(spot, strike, step) {
      if (spot == null || strike == null) return false;
      const next = strike + step;
      return spot >= strike && spot < next;
    }

    function formatChainExpiry(expiry) {
      if (!expiry) return "—";
      const raw = String(expiry);
      const d = new Date(`${raw}T00:00:00`);
      if (Number.isNaN(d.getTime())) return raw;
      return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
    }

    function renderChainSummary(data) {
      const el = document.getElementById("chainSummary");
      const shown = (data.rows || []).length;
      const atm = data.atm_strike;
      const mp = data.max_pain != null ? Math.round(data.max_pain) : null;
      el.innerHTML = `
        <span class="chain-summary-item">Spot <span class="chain-summary-val">${formatChainNum(data.spot)}</span></span>
        <span class="chain-summary-item chart-link" data-chart-price="${atm ?? ""}" data-chart-label="ATM" title="Drop ATM on chart">ATM <span class="chain-summary-val">${atm ?? "—"}</span></span>
        <span class="chain-summary-item">PCR <span class="chain-summary-val">${data.pcr != null ? Number(data.pcr).toFixed(3) : "—"}</span></span>
        <span class="chain-summary-item chart-link" data-chart-price="${mp ?? ""}" data-chart-label="Max pain" title="Drop max pain on chart">MP <span class="chain-summary-val">${mp ?? "—"}</span></span>
        <span class="chain-summary-item">Exp <span class="chain-summary-val">${formatChainExpiry(data.expiry)}</span></span>
        <span class="chain-summary-item">Rows <span class="chain-summary-val">${shown || "—"}</span></span>
      `;
      el.querySelectorAll("[data-chart-price]").forEach((node) => {
        node.addEventListener("click", () => {
          const px = Number(node.getAttribute("data-chart-price"));
          if (!Number.isFinite(px)) return;
          dropChartPriceLine(px, node.getAttribute("data-chart-label") || "Level");
        });
      });
    }

    function accumulateChainLeg(rows, legKey) {
      let oiSum = 0;
      let ltpSum = 0;
      let prevSum = 0;
      let oiN = 0;
      let ltpN = 0;
      let pctN = 0;
      for (const row of rows) {
        const leg = row[legKey] || {};
        const oi = leg.oi;
        const ltp = leg.ltp;
        const chg = leg.chg_pct;
        if (oi != null && !Number.isNaN(oi)) {
          oiSum += Number(oi);
          oiN += 1;
        }
        if (ltp != null && !Number.isNaN(ltp)) {
          ltpSum += Number(ltp);
          ltpN += 1;
        }
        if (ltp != null && chg != null && !Number.isNaN(ltp) && !Number.isNaN(chg)) {
          const chgNum = Number(chg);
          if (chgNum <= -100) continue;
          const denom = 1 + chgNum / 100;
          if (Math.abs(denom) < 1e-12) continue;
          prevSum += Number(ltp) / denom;
          pctN += 1;
        }
      }
      let chgPct = null;
      if (pctN > 0 && prevSum > 0) {
        const ltpForPct = rows.reduce((sum, row) => {
          const leg = row[legKey] || {};
          if (leg.ltp != null && leg.chg_pct != null && Number(leg.chg_pct) > -100) {
            return sum + Number(leg.ltp);
          }
          return sum;
        }, 0);
        chgPct = Math.round((ltpForPct - prevSum) / prevSum * 10000) / 100;
      }
      return {
        oi: oiN ? Math.round(oiSum) : null,
        ltp: ltpN ? Math.round(ltpSum * 100) / 100 : null,
        chg_pct: chgPct,
      };
    }

    function resolveChainTotals(data) {
      const apiTotals = data.totals;
      if (apiTotals && (apiTotals.ce || apiTotals.pe)) return apiTotals;
      const rows = data.rows || [];
      if (!rows.length) return { ce: {}, pe: {} };
      return {
        ce: accumulateChainLeg(rows, "ce"),
        pe: accumulateChainLeg(rows, "pe"),
      };
    }

    function renderChainTotals(data) {
      const tfoot = document.getElementById("chainTotals");
      const totals = resolveChainTotals(data);
      const ce = totals.ce || {};
      const pe = totals.pe || {};
      if (!(data.rows || []).length) {
        tfoot.innerHTML = "";
        return;
      }
      tfoot.innerHTML = `<tr class="chain-total-row">
        <td class="ce-side">${formatChainOi(ce.oi)}</td>
        <td class="ce-side">${formatChainChg(ce.chg_pct)}</td>
        <td class="ce-side">${formatChainNum(ce.ltp)}</td>
        <td class="strike-col"><span class="chain-total-label">Total</span></td>
        <td class="pe-side">${formatChainNum(pe.ltp)}</td>
        <td class="pe-side">${formatChainChg(pe.chg_pct)}</td>
        <td class="pe-side">${formatChainOi(pe.oi)}</td>
      </tr>`;
    }

    function renderChainRows(data) {
      const tbody = document.getElementById("chainRows");
      const rows = data.rows || [];
      const maxPain = data.max_pain != null ? Math.round(data.max_pain) : null;
      const spot = data.spot;
      const step = 50;
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="chain-muted" style="text-align:center">No chain rows</td></tr>';
        renderChainTotals(data);
        return;
      }
      tbody.innerHTML = rows.map(row => {
        const ce = row.ce || {};
        const pe = row.pe || {};
        const classes = [];
        if (row.is_atm) classes.push("atm-row");
        if (maxPain != null && row.strike === maxPain) classes.push("max-pain-row");
        if (spotStrikeMarker(spot, row.strike, step)) classes.push("spot-marker");
        const cls = classes.join(" ");
        return `<tr class="${cls}" data-strike="${row.strike}">
          <td class="ce-side">${formatChainOi(ce.oi)}</td>
          <td class="ce-side">${formatChainChg(ce.chg_pct)}</td>
          <td class="ce-side">${formatChainNum(ce.ltp)}</td>
          <td class="strike-col">${row.strike}</td>
          <td class="pe-side">${formatChainNum(pe.ltp)}</td>
          <td class="pe-side">${formatChainChg(pe.chg_pct)}</td>
          <td class="pe-side">${formatChainOi(pe.oi)}</td>
        </tr>`;
      }).join("");

      renderChainTotals(data);

      if (chainScrollPending) {
        chainScrollPending = false;
        const target = tbody.querySelector("tr.atm-row") || tbody.querySelector("tr.spot-marker");
        if (target) {
          target.scrollIntoView({ block: "center", behavior: "instant" });
        }
      }
    }

    const chainTableWrap = document.getElementById("chainTableWrap");
    if (chainTableWrap && !chainTableWrap.dataset.chartLinkReady) {
      chainTableWrap.dataset.chartLinkReady = "1";
      chainTableWrap.addEventListener("click", (event) => {
        const cell = event.target.closest("td.strike-col");
        const row = event.target.closest("tr[data-strike]");
        if (!cell || !row || row.classList.contains("chain-total-row")) return;
        const px = Number(row.getAttribute("data-strike"));
        if (!Number.isFinite(px)) return;
        const label = row.classList.contains("atm-row")
          ? "ATM"
          : row.classList.contains("max-pain-row")
            ? "Max pain"
            : "Strike";
        dropChartPriceLine(px, label);
      });
    }

    async function loadChainSnapshot() {
      if (document.visibilityState === "hidden") return;
      try {
        const resp = await fetch(withNotebookQuery("/api/chain"));
        if (!resp.ok) {
          document.getElementById("chainMeta").textContent = "Failed to load chain";
          return;
        }
        const data = await resp.json();
        document.getElementById("chainMeta").textContent = "";
        renderChainSummary(data);
        renderChainRows(data);
      } catch (_) {
        document.getElementById("chainMeta").textContent = "Chain request failed";
      }
    }

    function stopChainPoll() {
      if (chainPollTimer != null) {
        clearInterval(chainPollTimer);
        chainPollTimer = null;
      }
    }

    function startChainPoll() {
      stopChainPoll();
      chainPollTimer = setInterval(() => { loadChainSnapshot(); }, CHAIN_POLL_MS);
    }

    function syncPollersToVisibility() {
      if (document.visibilityState === "hidden") {
        stopChainPoll();
        stopCandlePoll();
        stopPaperPoll();
        return;
      }
      loadChainSnapshot();
      startChainPoll();
      refreshNiftyCandles();
      startCandlePoll();
      if (notebookId === "nifty") {
        loadPaperSnapshot();
        startPaperPoll();
      }
    }

    document.addEventListener("visibilitychange", syncPollersToVisibility);

    chainScrollPending = true;
    loadChainSnapshot();
    startChainPoll();
    if (notebookId === "nifty") {
      loadPaperSnapshot();
      startPaperPoll();
    }

    function formatOi(value) {
      if (value == null || Number.isNaN(value)) return null;
      return Math.round(value).toLocaleString("en-IN");
    }

    function cardSubHtml(id, feed) {
      if (!feed) return "";
      if ((id === "oi_day_high" || id === "oi_pct_chg") && feed.fut_oi != null) {
        let text = `OI ${formatOi(feed.fut_oi)}`;
        if (feed.fut_oi_day_high != null) {
          text += ` · high ${formatOi(feed.fut_oi_day_high)}`;
        }
        return `<div class="card-sub">${text}</div>`;
      }
      if (id === "iv_day_high" && (feed.iv_day_low != null || feed.iv_day_high != null)) {
        const bits = [];
        if (feed.iv_day_low != null) bits.push(`Low ${Number(feed.iv_day_low).toFixed(2)}`);
        if (feed.iv_day_high != null) bits.push(`High ${Number(feed.iv_day_high).toFixed(2)}`);
        if (feed.iv_vs_day_low != null) bits.push(`${Number(feed.iv_vs_day_low).toFixed(1)}% of low`);
        return `<div class="card-sub">${bits.join(" · ")}</div>`;
      }
      if (id === "ivp" && feed.ivp_proxy_days != null) {
        const proxy = Number(feed.ivp_proxy_days) || 0;
        const real = Number(feed.ivp_real_days) || 0;
        if (real === 0 && proxy > 0) {
          return `<div class="card-sub" title="Historical IV bootstrapped from scaled India VIX. Real EOD ATM IV replaces proxy days over time.">VIX proxy · ${proxy}d</div>`;
        }
        if (real > 0 && proxy > 0) {
          return `<div class="card-sub">${real}d NSE · ${proxy}d proxy</div>`;
        }
        if (real > 0) {
          return `<div class="card-sub">${real}d NSE FO</div>`;
        }
      }
      if ((id === "adx" || id === "atr") && feed.adx_hint) {
        const hint = String(feed.adx_hint);
        const short = hint.length > 28 ? hint.slice(0, 28) + "…" : hint;
        return `<div class="card-sub" title="${escapeHtml(hint)}">${escapeHtml(short)}</div>`;
      }
      return "";
    }

    function formatValue(value, id) {
      if (value == null || Number.isNaN(value)) return "—";
      if (id === "pcr") return value.toFixed(3);
      if (id === "ivp" || id === "oi_pct_chg" || id === "oi_day_high") return value.toFixed(1) + "%";
      if (id.endsWith("_chg") && id !== "vix_chg") return (value >= 0 ? "+" : "") + value.toFixed(2) + "%";
      if (id === "vix_chg") return (value >= 0 ? "+" : "") + value.toFixed(2);
      if (id === "ce" || id === "pe" || id === "adx" || id === "atr" || id === "iv_day_high") return value.toFixed(2);
      if (id === "max_pain") return String(Math.round(value));
      return Number.isInteger(value) ? String(value) : value.toFixed(2);
    }

    function updateStickyTicks(rows, now) {
      for (const r of rows) {
        const cur = r.value;
        if (cur == null || Number.isNaN(cur)) continue;
        const prev = prevValues.get(r.id);
        if (prev !== undefined && cur !== prev) {
          stickyTicks.set(r.id, {
            tick: cur > prev ? "up" : "down",
            until: now + TICK_STICKY_MS,
          });
        }
        prevValues.set(r.id, cur);
      }
      for (const [id, sticky] of stickyTicks) {
        if (sticky.until <= now) stickyTicks.delete(id);
      }
    }

    function liveValueHtml(r, now) {
      const formatted = formatValue(r.value, r.id);
      if (formatted === "—") {
        return `<span class="live na">${formatted}</span>`;
      }

      const sticky = stickyTicks.get(r.id);
      const movementTick = sticky && sticky.until > now ? sticky.tick : null;
      let tone = "neutral";
      let arrow = "";

      if (movementTick === "up") {
        tone = "up";
        arrow = "▲";
      } else if (movementTick === "down") {
        tone = "down";
        arrow = "▼";
      }

      const mark = arrow ? `<span class="arrow">${arrow}</span>` : "";
      return `<span class="live ${tone}">${mark}${formatted}</span>`;
    }

    function formatChgPts(value) {
      if (value == null || Number.isNaN(value)) return { text: "—", tone: "na" };
      const text = (value >= 0 ? "+" : "") + value.toLocaleString("en-IN", { maximumFractionDigits: 2 });
      const tone = value > 0 ? "up" : value < 0 ? "down" : "na";
      return { text, tone };
    }

    function formatChgPct(value) {
      if (value == null || Number.isNaN(value)) return { text: "—", tone: "na" };
      const text = (value >= 0 ? "+" : "") + value.toFixed(3) + "%";
      const tone = value > 0 ? "up" : value < 0 ? "down" : "na";
      return { text, tone };
    }

    function indexCardHtml(item) {
      const ltp = item.ltp != null
        ? item.ltp.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : "—";
      const chgPts = formatChgPts(item.chg_pts);
      const chg = formatChgPct(item.chg_pct);
      const cardTone = chg.tone !== "na" ? chg.tone : chgPts.tone;
      const name = escapeHtml(item.label || item.id || "");
      return `<article class="watch-card ${cardTone !== "na" ? cardTone : ""}">
        <div class="name">${name}</div>
        <div class="ltp">${ltp}</div>
        <div class="chg-row">
          <span class="chg ${chgPts.tone}">${chgPts.text}</span>
          <span class="chg ${chg.tone}">${chg.text}</span>
        </div>
      </article>`;
    }

    function watchGroupHtml(label, cols, items) {
      if (!items.length) return "";
      return `<section class="watch-group">
        <div class="watch-group-label">${escapeHtml(label)}</div>
        <div class="watch-group-cards cols-${cols}">${items.map(indexCardHtml).join("")}</div>
      </section>`;
    }

    function renderIndices(indices) {
      const strip = document.getElementById("indexStrip");
      const items = indices && indices.length ? indices : [];
      if (!items.length) {
        strip.innerHTML = "";
        return;
      }
      const byGroup = { index: [], fut: [], stock: [] };
      for (const item of items) {
        const g = item.group && byGroup[item.group] ? item.group : "index";
        byGroup[g].push(item);
      }
      strip.innerHTML =
        `<div class="watch-top">${watchGroupHtml("Indices", 5, byGroup.index)}${watchGroupHtml("Futures", 4, byGroup.fut)}</div>` +
        watchGroupHtml("Stocks", 11, byGroup.stock);
    }

    function metricHead(row) {
      return METRIC_HEAD[row.id] || row.label || row.id;
    }

    function renderMetricCard(r, now, feed) {
      const tone = r.passed === true ? "pass" : r.passed === false ? "fail" : "info";
      const sub = cardSubHtml(r.id, feed);
      const target = r.target ? `<div class="card-target">${escapeHtml(r.target)}</div>` : "";
      const linkPrice = r.id === "max_pain" && r.value != null ? Math.round(Number(r.value)) : null;
      const linkAttrs = linkPrice != null
        ? ` data-chart-price="${linkPrice}" data-chart-label="Max pain" title="Drop max pain on chart"`
        : "";
      return `<article class="metric-card ${tone}${linkPrice != null ? " chart-link" : ""}"${linkAttrs}>
        <div class="card-label">${escapeHtml(metricHead(r))}</div>
        <div class="card-value">${liveValueHtml(r, now)}</div>
        ${sub}
        ${target}
      </article>`;
    }

    function renderSheet(rows, now, feed) {
      const byId = new Map(rows.map(r => [r.id, r]));
      const used = new Set();
      const cells = [];
      for (const id of CARD_ORDER) {
        const r = byId.get(id);
        if (!r) continue;
        used.add(r.id);
        cells.push(renderMetricCard(r, now, feed));
      }
      for (const r of rows) {
        if (used.has(r.id)) continue;
        cells.push(renderMetricCard(r, now, feed));
      }

      const host = document.getElementById("sheetGroups");
      host.innerHTML = cells.length
        ? cells.join("")
        : '<div style="text-align:center;color:var(--muted);padding:32px">Waiting for feed…</div>';
      host.querySelectorAll("[data-chart-price]").forEach((node) => {
        node.addEventListener("click", () => {
          const px = Number(node.getAttribute("data-chart-price"));
          if (!Number.isFinite(px)) return;
          dropChartPriceLine(px, node.getAttribute("data-chart-label") || "Level");
        });
      });
    }

    function updateEntryBell(evaln) {
      const bell = document.getElementById("parityBell");
      const tip = document.getElementById("bellGateTip");
      if (!bell) return;
      const ready = !!evaln.entry_ready;
      const passed = evaln.passed ?? 0;
      const total = evaln.gates_total ?? 0;
      const failing = evaln.failing_gates || [];
      const missing = evaln.missing_gates || [];
      bell.classList.remove("green", "orange", "red");
      if (tip) {
        const gated = (evaln.rows || []).filter((row) => row.gates_entry);
        const items = gated.length
          ? gated.map((row) => {
              const label = String(row.label || row.id || "");
              let state = "pass";
              let mark = "ok";
              if (failing.includes(label) || row.passed === false) {
                state = "fail";
                mark = "fail";
              } else if (missing.includes(label) || row.passed == null) {
                state = "miss";
                mark = "—";
              }
              return `<li class="${state}"><span>${escapeHtml(label)}</span><span class="gate-state">${mark}</span></li>`;
            })
          : [
              ...failing.map((name) => `<li class="fail"><span>${escapeHtml(name)}</span><span class="gate-state">fail</span></li>`),
              ...missing.map((name) => `<li class="miss"><span>${escapeHtml(name)}</span><span class="gate-state">—</span></li>`),
            ];
        const head = ready
          ? `Notebook ${passed}/${total} · all passing`
          : `Notebook ${passed}/${total}`;
        const body = items.length
          ? `<ul>${items.join("")}</ul>`
          : `<ul><li class="miss"><span>Waiting for notebook gates</span><span class="gate-state">—</span></li></ul>`;
        tip.innerHTML = `<div class="bell-gate-tip-head">${escapeHtml(head)}</div>${body}`;
      }
      bell.removeAttribute("title");
      if (ready) {
        bell.classList.add("green");
        bell.setAttribute("aria-label", `Entry ready ${passed}/${total}`);
        if (lastParityState !== "ready") playTempleBellTwice();
        lastParityState = "ready";
        return;
      }
      const parts = [];
      if (missing.length) parts.push(`Missing: ${missing.join(", ")}`);
      if (failing.length) parts.push(`Failing: ${failing.join(", ")}`);
      bell.setAttribute(
        "aria-label",
        parts.length
          ? `Entry not ready ${passed}/${total}. ${parts.join(". ")}`
          : `Entry not ready ${passed}/${total}`,
      );
      lastParityState = "idle";
    }

    function parityAudioContext() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!parityAudioCtx) parityAudioCtx = new Ctx();
      if (parityAudioCtx.state === "suspended") parityAudioCtx.resume();
      return parityAudioCtx;
    }

    function strikeTempleBell(ctx, start) {
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, start);
      master.gain.exponentialRampToValueAtTime(0.7, start + 0.014);
      master.gain.exponentialRampToValueAtTime(0.22, start + 0.22);
      master.gain.exponentialRampToValueAtTime(0.0001, start + 2.8);
      master.connect(ctx.destination);

      const noiseLen = Math.floor(ctx.sampleRate * 0.05);
      const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
      const noiseData = noiseBuf.getChannelData(0);
      for (let i = 0; i < noiseLen; i += 1) {
        noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseLen);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.setValueAtTime(1600, start);
      noiseFilter.Q.setValueAtTime(1.4, start);
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.28, start);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.09);
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(start);
      noise.stop(start + 0.1);

      const partials = [
        [196.0, 1.00, 3.1],
        [392.4, 0.42, 2.5],
        [511.0, 0.26, 2.0],
        [784.0, 0.14, 1.5],
        [990.0, 0.09, 1.15],
        [1176, 0.06, 0.85],
        [1568, 0.035, 0.55],
      ];
      partials.forEach(([freq, amp, decay]) => {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.986, start + decay);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(amp, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + decay);
        osc.connect(gain);
        gain.connect(master);
        osc.start(start);
        osc.stop(start + decay + 0.04);
      });
    }

    function playTempleBellTwice() {
      const ctx = parityAudioContext();
      if (!ctx) return;
      const fire = () => {
        if (ctx.state !== "running") {
          pendingParityBell = true;
          return;
        }
        pendingParityBell = false;
        const start = ctx.currentTime + 0.03;
        if (start < (playTempleBellTwice._until || 0)) return;
        playTempleBellTwice._until = start + PARITY_BELL_MIN_INTERVAL_S;
        strikeTempleBell(ctx, start);
        strikeTempleBell(ctx, start + PARITY_BELL_PAIR_GAP_S);
      };
      if (ctx.state === "running") {
        fire();
        return;
      }
      pendingParityBell = true;
      ctx.resume().then(fire).catch(() => {});
    }

    function unlockParityAudio() {
      const ctx = parityAudioContext();
      if (!ctx) return;
      ctx.resume().then(() => {
        if (pendingParityBell) playTempleBellTwice();
      }).catch(() => {});
    }

    function render(frame) {
      if (frame && frame.notebook && frame.notebook.label) {
        const h1 = document.getElementById("nbTitle");
        if (h1) h1.textContent = frame.notebook.label;
        document.title = `Atlas Lite — ${frame.notebook.label}`;
      }
      renderIndices(frame.indices);
      document.getElementById("atm").textContent = frame.atm_strike ?? "—";
      const atmWrap = document.querySelector(".header-atm");
      if (atmWrap) {
        atmWrap.title = frame.atm_strike != null ? "Drop ATM on chart" : "ATM";
        atmWrap.dataset.chartPrice = frame.atm_strike != null ? String(frame.atm_strike) : "";
      }
      const legs = [frame.ce_symbol, frame.pe_symbol]
        .filter(Boolean)
        .map(s => String(s).replace(/^NFO:/, ""))
        .join(" · ");
      document.getElementById("legs").textContent = legs;
      document.getElementById("legs").title = [frame.ce_symbol, frame.pe_symbol].filter(Boolean).join(" · ");
      const t = frame.ticker || {};
      const age = t.last_tick_age_s != null ? t.last_tick_age_s + "s" : "—";
      document.getElementById("feedPath").textContent =
        `${t.path || (t.connected ? "ws" : "…")} · tick ${age}`;

      if (frame.computed_at_ms) {
        const tsEl = document.getElementById("timestamp");
        tsEl.textContent = formatLiveTimestamp(frame.computed_at_ms);
        tsEl.title = new Date(frame.computed_at_ms).toISOString();
      }

      const evaln = frame.evaluation || {};
      const badge = document.getElementById("entryBadge");
      const gateTotal = evaln.gates_total ?? evaln.evaluable ?? 0;
      const gateLabel = gateTotal > 0
        ? ` (${evaln.passed ?? 0}/${gateTotal})`
        : "";
      function gateStatusTitle() {
        const parts = [];
        if ((evaln.missing_gates || []).length) {
          parts.push(`Missing data: ${evaln.missing_gates.join(", ")}`);
        }
        if ((evaln.failing_gates || []).length) {
          parts.push(`Failing: ${evaln.failing_gates.join(", ")}`);
        }
        return parts.length ? parts.join(" · ") : "One or more gated entry checks are failing or missing data";
      }
      if (evaln.entry_ready) {
        badge.textContent = `ENTRY READY${gateLabel}`;
        badge.className = "badge ready";
        badge.title = "All gated entry checks are passing";
      } else {
        badge.textContent = `NOT READY${gateLabel}`;
        badge.className = "badge wait";
        badge.title = gateStatusTitle();
      }

      updateEntryBell(evaln);

      const warns = frame.live_warnings || [];
      document.getElementById("warnings").innerHTML = warns.length
        ? warns.map(w => `<div class="warn">${escapeHtml(w)}</div>`).join("") : "";

      const rows = evaln.rows || [];
      const now = Date.now();
      latestFeedAdx = frame.feed?.adx ?? null;
      latestFeedAtr = frame.feed?.atr ?? null;
      updateStickyTicks(rows, now);
      renderSheet(rows, now, frame.feed || {});
      if (Array.isArray(frame.live_bars) && frame.live_bars.length) {
        applyLiveCandleBars(frame.live_bars);
      }
    }

    async function connect() {
      while (true) {
        try {
          if (streamAbort) streamAbort.abort();
          streamAbort = new AbortController();
          const resp = await fetch(withNotebookQuery("/stream"), { signal: streamAbort.signal });
          const reader = resp.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const parts = buf.split("\n\n");
            buf = parts.pop() || "";
            for (const chunk of parts) {
              const line = chunk.split("\n").find(l => l.startsWith("data: "));
              if (!line) continue;
              try { render(JSON.parse(line.slice(6))); } catch (_) {}
            }
          }
        } catch (err) {
          if (err && err.name === "AbortError") {
            await new Promise(r => setTimeout(r, 50));
            continue;
          }
        }
        await new Promise(r => setTimeout(r, 2000));
      }
    }

    function switchNotebook(nextId) {
      const id = nextId === "sensex" ? "sensex" : "nifty";
      if (id === notebookId) return;
      notebookId = id;
      const url = new URL(window.location.href);
      url.searchParams.set("nb", notebookId);
      window.history.replaceState({}, "", url.pathname + "?" + url.searchParams.toString());
      applyNotebookChrome();
      niftyRawBars = [];
      niftyLastBarTime = null;
      if (typeof serverDmiByTime !== "undefined" && serverDmiByTime && typeof serverDmiByTime.clear === "function") {
        serverDmiByTime.clear();
      }
      refreshNiftyCandles();
      loadChainSnapshot();
      if (notebookId === "nifty") {
        loadPaperSnapshot();
        startPaperPoll();
      } else {
        stopPaperPoll();
        const host = document.getElementById("paperBar");
        if (host) host.hidden = true;
      }
      if (streamAbort) streamAbort.abort();
    }

    document.getElementById("nbSwitch")?.addEventListener("click", (event) => {
      const link = event.target.closest("a[data-nb]");
      if (!link) return;
      event.preventDefault();
      switchNotebook(link.dataset.nb);
    });

    renderChartToolbar();
    renderDrawBar();
    const atmWrap = document.querySelector(".header-atm");
    if (atmWrap && !atmWrap.dataset.chartLinkReady) {
      atmWrap.dataset.chartLinkReady = "1";
      atmWrap.addEventListener("click", () => {
        const px = Number(atmWrap.dataset.chartPrice || document.getElementById("atm")?.textContent);
        if (!Number.isFinite(px)) return;
        dropChartPriceLine(px, "ATM");
      });
    }
    refreshNiftyCandles();
    startCandlePoll();
    connect();
  </script>
