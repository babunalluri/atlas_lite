services:
  atlas-lite:
    build: .
    container_name: atlas-lite
    restart: unless-stopped
    ports:
      - "3000:8090"
    environment:
      ATLAS_LITE_LOG_LEVEL: WARNING
      ATLAS_LITE_RECORD: "1"
      ATLAS_LITE_RECORD_START: "09:00"
      ATLAS_LITE_RECORD_END: "15:35"
      ATLAS_LITE_RECORD_WEEKDAYS_ONLY: "1"
      ATLAS_LITE_RECORD_KEEP_DAYS: "365"
      KITE_CREDENTIALS_PATH: /secrets/kite_credentials
      ATLAS_LITE_LLM_CREDENTIALS_PATH: /secrets/llm_credentials
      # Set on the host before `docker compose up` so agent POSTs require X-Atlas-Token.
      ATLAS_LITE_API_TOKEN: ${ATLAS_LITE_API_TOKEN:-}
      # Live UI locked until host sets 1; Live checkbox also requires UI login.
      ATLAS_LITE_AGENT_LIVE_ALLOWED: ${ATLAS_LITE_AGENT_LIVE_ALLOWED:-0}
      # Agent entry knobs (looser week defaults in code; override here to tighten).
      ATLAS_LITE_AGENT_MORNING_MIN_SCORE: ${ATLAS_LITE_AGENT_MORNING_MIN_SCORE:-3}
      ATLAS_LITE_AGENT_MORNING_SCORE_UNTIL: ${ATLAS_LITE_AGENT_MORNING_SCORE_UNTIL:-10:30}
      ATLAS_LITE_AGENT_SPOT_AGAINST_PCT: ${ATLAS_LITE_AGENT_SPOT_AGAINST_PCT:-0.20}
      ATLAS_LITE_AGENT_WIN_REENTRY_COOLDOWN_MIN: ${ATLAS_LITE_AGENT_WIN_REENTRY_COOLDOWN_MIN:-5}
      ATLAS_LITE_AGENT_COOLDOWN_MIN: ${ATLAS_LITE_AGENT_COOLDOWN_MIN:-5}
      ATLAS_LITE_AGENT_DAILY_LOSS_STOP: ${ATLAS_LITE_AGENT_DAILY_LOSS_STOP:-2000}
      # Scalper v2 (₹20k): buy-with-trend, max 3/day, morning window, 20/10/30 exits.
      ATLAS_LITE_AGENT_SCALPER_V2: ${ATLAS_LITE_AGENT_SCALPER_V2:-1}
      ATLAS_LITE_AGENT_MAX_TRADES_DAY: ${ATLAS_LITE_AGENT_MAX_TRADES_DAY:-3}
      ATLAS_LITE_AGENT_ALLOW_LONG: ${ATLAS_LITE_AGENT_ALLOW_LONG:-1}
      ATLAS_LITE_AGENT_ALLOW_SHORT: ${ATLAS_LITE_AGENT_ALLOW_SHORT:-0}
      ATLAS_LITE_AGENT_ENTRY_AFTER: ${ATLAS_LITE_AGENT_ENTRY_AFTER:-09:30}
      ATLAS_LITE_AGENT_ENTRY_UNTIL: ${ATLAS_LITE_AGENT_ENTRY_UNTIL:-12:00}
      ATLAS_LITE_AGENT_TREND_LONG_PTS: ${ATLAS_LITE_AGENT_TREND_LONG_PTS:-100}
      ATLAS_LITE_AGENT_TREND_LONG_AFTER: ${ATLAS_LITE_AGENT_TREND_LONG_AFTER:-09:30}
      ATLAS_LITE_AGENT_TREND_LONG_UNTIL: ${ATLAS_LITE_AGENT_TREND_LONG_UNTIL:-12:00}
      # Naked short book kept disabled until capital ≥ ~₹1.5L.
      ATLAS_LITE_AGENT_TREND_SHORT_PTS: ${ATLAS_LITE_AGENT_TREND_SHORT_PTS:-100}
      ATLAS_LITE_AGENT_TREND_SHORT_AFTER: ${ATLAS_LITE_AGENT_TREND_SHORT_AFTER:-10:30}
      ATLAS_LITE_AGENT_TREND_SHORT_UNTIL: ${ATLAS_LITE_AGENT_TREND_SHORT_UNTIL:-14:30}
      # Set email + password + (SESSION_SECRET or API_TOKEN) in host .env — never commit.
      ATLAS_LITE_UI_EMAIL: ${ATLAS_LITE_UI_EMAIL:-}
      ATLAS_LITE_UI_PASSWORD: ${ATLAS_LITE_UI_PASSWORD:-}
      ATLAS_LITE_SESSION_SECRET: ${ATLAS_LITE_SESSION_SECRET:-}
    volumes:
      - ./kite_credentials:/secrets/kite_credentials:ro
      - ./llm_credentials:/secrets/llm_credentials:ro
      - ./data:/app/data
      - ./static:/app/static:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
