services:
  atlas-lite:
    build: .
    container_name: atlas-lite
    restart: unless-stopped
    ports:
      - "3000:8090"
    environment:
      ATLAS_LITE_LOG_LEVEL: WARNING
      ATLAS_LITE_RECORD: "1"
      ATLAS_LITE_RECORD_START: "09:00"
      ATLAS_LITE_RECORD_END: "15:35"
      ATLAS_LITE_RECORD_WEEKDAYS_ONLY: "1"
      ATLAS_LITE_RECORD_KEEP_DAYS: "365"
      KITE_CREDENTIALS_PATH: /secrets/kite_credentials
      ATLAS_LITE_LLM_CREDENTIALS_PATH: /secrets/llm_credentials
      # Set on the host before `docker compose up` so agent POSTs require X-Atlas-Token.
      ATLAS_LITE_API_TOKEN: ${ATLAS_LITE_API_TOKEN:-}
      # Live UI locked until host sets 1; Live checkbox also requires UI login.
      ATLAS_LITE_AGENT_LIVE_ALLOWED: ${ATLAS_LITE_AGENT_LIVE_ALLOWED:-0}
      # NSE–BSE arb live (confirmed ₹500 IOC). Locked until host sets 1; day stop ₹2k default.
      ATLAS_LITE_ARB_LIVE_ALLOWED: ${ATLAS_LITE_ARB_LIVE_ALLOWED:-0}
      ATLAS_LITE_ARB_LIVE_DAY_STOP: ${ATLAS_LITE_ARB_LIVE_DAY_STOP:-2000}
      # factor_paper forward test (paper only, never Kite orders). Off unless the host sets 1.
      ATLAS_LITE_PAPER_FACTOR: ${ATLAS_LITE_PAPER_FACTOR:-0}
      # Weekly NIFTY strangle + 5%-wing condor paper books (paper only). On unless the host sets 0.
      ATLAS_LITE_PAPER_WEEKLY_SELL: ${ATLAS_LITE_PAPER_WEEKLY_SELL:-1}
      # Scalper v3: daily 13:00 ATM straddle sale (paper only). On unless the host sets 0.
      ATLAS_LITE_PAPER_SCALPER_V3: ${ATLAS_LITE_PAPER_SCALPER_V3:-1}
      # Long straddle: daily 09:16 ATM straddle purchase, sold 13:00 (paper only). On unless the host sets 0.
      ATLAS_LITE_PAPER_LONG_STRADDLE: ${ATLAS_LITE_PAPER_LONG_STRADDLE:-1}
      # Long straddle live orders: locked until the host sets 1; then only on a day "Live straddle" is ticked.
      ATLAS_LITE_STRADDLE_LIVE_ALLOWED: ${ATLAS_LITE_STRADDLE_LIVE_ALLOWED:-0}
      # Same entry with a resting +20% take-profit, else 13:00 (paper only). On unless the host sets 0.
      ATLAS_LITE_PAPER_LONG_STRADDLE_TP20: ${ATLAS_LITE_PAPER_LONG_STRADDLE_TP20:-1}
      # Retired 2026-10-30 after the paper review (14:30 straddle, theta cliff, ICT). Off unless the host sets 1.
      ATLAS_LITE_PAPER_SHORT_STR: ${ATLAS_LITE_PAPER_SHORT_STR:-0}
      ATLAS_LITE_PAPER_THETA_CLIFF: ${ATLAS_LITE_PAPER_THETA_CLIFF:-0}
      ATLAS_LITE_PAPER_ICT: ${ATLAS_LITE_PAPER_ICT:-0}
      # Retired 2026-11-02: shadow -₹2,450 over 42 trades (all from morning shorts); its side choice
      # never beat random. Ledger and model kept. Off unless the host sets 1.
      ATLAS_LITE_PAPER_AI_AGENT: ${ATLAS_LITE_PAPER_AI_AGENT:-0}
      # Agent entry knobs (looser week defaults in code; override here to tighten).
      ATLAS_LITE_AGENT_MORNING_MIN_SCORE: ${ATLAS_LITE_AGENT_MORNING_MIN_SCORE:-3}
      ATLAS_LITE_AGENT_MORNING_SCORE_UNTIL: ${ATLAS_LITE_AGENT_MORNING_SCORE_UNTIL:-10:30}
      ATLAS_LITE_AGENT_SPOT_AGAINST_PCT: ${ATLAS_LITE_AGENT_SPOT_AGAINST_PCT:-0.20}
      ATLAS_LITE_AGENT_WIN_REENTRY_COOLDOWN_MIN: ${ATLAS_LITE_AGENT_WIN_REENTRY_COOLDOWN_MIN:-5}
      ATLAS_LITE_AGENT_COOLDOWN_MIN: ${ATLAS_LITE_AGENT_COOLDOWN_MIN:-5}
      ATLAS_LITE_AGENT_DAILY_LOSS_STOP: ${ATLAS_LITE_AGENT_DAILY_LOSS_STOP:-2000}
      # Scalper v2 (₹20k): buy-with-trend, max 3/day, morning window, 20/10/30 exits.
      ATLAS_LITE_AGENT_SCALPER_V2: ${ATLAS_LITE_AGENT_SCALPER_V2:-1}
      ATLAS_LITE_AGENT_MAX_TRADES_DAY: ${ATLAS_LITE_AGENT_MAX_TRADES_DAY:-3}
      ATLAS_LITE_AGENT_ALLOW_LONG: ${ATLAS_LITE_AGENT_ALLOW_LONG:-1}
      ATLAS_LITE_AGENT_ALLOW_SHORT: ${ATLAS_LITE_AGENT_ALLOW_SHORT:-0}
      ATLAS_LITE_AGENT_ENTRY_AFTER: ${ATLAS_LITE_AGENT_ENTRY_AFTER:-09:30}
      ATLAS_LITE_AGENT_ENTRY_UNTIL: ${ATLAS_LITE_AGENT_ENTRY_UNTIL:-12:00}
      ATLAS_LITE_AGENT_TREND_LONG_PTS: ${ATLAS_LITE_AGENT_TREND_LONG_PTS:-100}
      ATLAS_LITE_AGENT_TREND_LONG_AFTER: ${ATLAS_LITE_AGENT_TREND_LONG_AFTER:-09:30}
      ATLAS_LITE_AGENT_TREND_LONG_UNTIL: ${ATLAS_LITE_AGENT_TREND_LONG_UNTIL:-12:00}
      # Naked short book kept disabled until capital ≥ ~₹1.5L.
      ATLAS_LITE_AGENT_TREND_SHORT_PTS: ${ATLAS_LITE_AGENT_TREND_SHORT_PTS:-100}
      ATLAS_LITE_AGENT_TREND_SHORT_AFTER: ${ATLAS_LITE_AGENT_TREND_SHORT_AFTER:-10:30}
      ATLAS_LITE_AGENT_TREND_SHORT_UNTIL: ${ATLAS_LITE_AGENT_TREND_SHORT_UNTIL:-14:30}
      # Set email + password + (SESSION_SECRET or API_TOKEN) in host .env — never commit.
      ATLAS_LITE_UI_EMAIL: ${ATLAS_LITE_UI_EMAIL:-}
      ATLAS_LITE_UI_PASSWORD: ${ATLAS_LITE_UI_PASSWORD:-}
      ATLAS_LITE_SESSION_SECRET: ${ATLAS_LITE_SESSION_SECRET:-}
    volumes:
      - ./kite_credentials:/secrets/kite_credentials:ro
      - ./llm_credentials:/secrets/llm_credentials:ro
      - ./data:/app/data
      - ./static:/app/static:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # NSE vs BSE gap watcher (scripts/nse_bse_gap_watch.py): paper tracks always; real LIMIT IOC orders
  # only when ATLAS_LITE_ARB_LIVE_ALLOWED=1 and data/arb_live.json enabled (confirmed ₹500 @ 300 ms).
  # Day-loss kill: ATLAS_LITE_ARB_LIVE_DAY_STOP (default 2000). Own Kite websocket. Restarts with the
  # stack; idles after ATLAS_LITE_ARB_UNTIL, or when ATLAS_LITE_ARB_WATCH=0.
  arb-watch:
    build: .
    container_name: atlas-lite-arb
    restart: unless-stopped
    command: ["python", "scripts/nse_bse_gap_watch.py", "--until", "${ATLAS_LITE_ARB_UNTIL:-2026-11-06}"]
    environment:
      KITE_CREDENTIALS_PATH: /secrets/kite_credentials
      ATLAS_LITE_ARB_WATCH: ${ATLAS_LITE_ARB_WATCH:-1}
      ATLAS_LITE_ARB_LIVE_ALLOWED: ${ATLAS_LITE_ARB_LIVE_ALLOWED:-0}
      ATLAS_LITE_ARB_LIVE_DAY_STOP: ${ATLAS_LITE_ARB_LIVE_DAY_STOP:-2000}
      ATLAS_LITE_ARB_LIVE_AFTER: ${ATLAS_LITE_ARB_LIVE_AFTER:-09:15}
      ATLAS_LITE_ARB_LIVE_UNTIL: ${ATLAS_LITE_ARB_LIVE_UNTIL:-09:20}
    volumes:
      - ./kite_credentials:/secrets/kite_credentials:ro
      - ./data:/app/data
    healthcheck:
      disable: true  # the image's check calls the dashboard on 8090, which this service does not serve

  # Cash-futures spread paper watcher (scripts/cash_futures_watch.py): read-only research, never places
  # an order. Own Kite websocket (Kite allows 3 per key: engine, arb-watch, this). Also hosts the
  # 09:15–10:00 pre-open basis book (scripts/preopen_basis_watch.py → data/pob/) on the same socket.
  # Restarts with the stack; a restart replays the day's event log. Idles after ATLAS_LITE_CF_UNTIL,
  # or when ATLAS_LITE_CF_WATCH=0. Set ATLAS_LITE_POB_WATCH=0 to disable only the open-window book.
  cf-watch:
    build: .
    container_name: atlas-lite-cf
    restart: unless-stopped
    command: ["python", "scripts/cash_futures_watch.py", "--until", "${ATLAS_LITE_CF_UNTIL:-2026-11-13}"]
    environment:
      KITE_CREDENTIALS_PATH: /secrets/kite_credentials
      ATLAS_LITE_CF_WATCH: ${ATLAS_LITE_CF_WATCH:-1}
      ATLAS_LITE_POB_WATCH: ${ATLAS_LITE_POB_WATCH:-1}
    volumes:
      - ./kite_credentials:/secrets/kite_credentials:ro
      - ./data:/app/data
    healthcheck:
      disable: true
